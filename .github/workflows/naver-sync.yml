name: Naver saved-list sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: ['v38-naver-sync-ui']
    paths:
      - 'scripts/sync-naver.mjs'
      - 'scripts/sync-naver-browser.mjs'
      - '.github/workflows/naver-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast sync through Naver JSON endpoint
        id: fastsync
        continue-on-error: true
        env:
          NAVER_SHARE_URL: https://naver.me/xfboSqg8
        run: node scripts/sync-naver.mjs
      - name: Install browser fallback
        if: steps.fastsync.outcome == 'failure'
        run: npm install --no-save puppeteer@24
      - name: Browser sync fallback
        id: browsersync
        if: steps.fastsync.outcome == 'failure'
        continue-on-error: true
        env:
          NAVER_SHARE_URL: https://naver.me/xfboSqg8
        run: node scripts/sync-naver-browser.mjs
      - name: Commit refreshed list
        run: |
          if git diff --quiet -- data/naver-places.json; then
            echo 'No sync data change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/naver-places.json
          git commit -m 'chore: refresh Naver saved list'
          git push
      - name: Report sync result
        if: steps.fastsync.outcome == 'failure' && steps.browsersync.outcome == 'failure'
        run: |
          echo 'Naver sync did not complete. Previous places are preserved.'
          exit 1
