        run: node tests/v63-meal-workflow.cjs
      - name: Meal workflow UI integration
        run: node tests/v63-ui-integration.cjs
      - name: Shopping completion status regression
        run: node tests/v63-shopping-status.cjs
      - name: Final shopping checkbox UI
        run: node tests/v63-final-shopping-checkbox.cjs
      - name: Shopping workflow cache hard bypass
        run: node tests/v64-shopping-cache-bypass.cjs
      - name: Raw-only shopping list
        run: node tests/v65-shopping-raw-only.cjs
      - name: Two-batch prep stock allocation
        run: node tests/v66-prep-stock-allocation.cjs
      - name: Canonical v66 shell version
        run: node tests/v66-canonical-shell-version.cjs
      - name: Prep completion checklist
        run: node tests/v67-prep-completion.cjs
      - name: Prep summary clarity
        run: node tests/v67-prep-summary-clarity.cjs
      - name: Recipe editor mobile UI
