name: v56 stable shell restore tests

on:
  pull_request:
    branches: ["main"]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserved original app core tests
        run: node tests/core.cjs
      - name: v25 prep and cube inventory tests
        run: node tests/ppeuni-core.cjs
      - name: management stock-shopping-prep logic
        run: node tests/ops-v27.cjs
      - name: v29 management overview and workflow
        run: node tests/v29-management.cjs
      - name: v30 freezer inventory and prep split
        run: node tests/v30-freezer-prep.cjs
      - name: v31 total stock shopping readiness flow
        run: node tests/v31-inventory-flow.cjs
      - name: v32 unified stock entry flow
        run: node tests/v32-stock-entry.cjs
      - name: v33 next-week shopping and prep UX
        run: node tests/v33-management.cjs
      - name: v34 custom ingredient inventory flow
        run: node tests/v34-custom-ingredients.cjs
      - name: v35 batch deduction and next shopping recalculation
        run: node tests/v35-batch-deduct.cjs
      - name: v36 outing and map MVP
        run: node tests/v36-outing-map.cjs
      - name: v37 outing UI and Naver Maps bridge
        run: node tests/v37-outing-polish.cjs
      - name: v38 Naver saved-list auto sync
        run: node tests/v38-naver-sync.cjs
      - name: v39 displayed version and map opening fallback
        run: node tests/v39-version-map-fix.cjs
      - name: v40 seed 28 Naver outing places
        run: node tests/v40-naver-places.cjs
      - name: v41 remove embedded Leaflet maps
        run: node tests/v41-no-embedded-map.cjs
      - name: v42 prioritize unvisited outing places
        run: node tests/v42-outing-priority.cjs
      - name: v43 health checkup and vaccination manager
        run: node tests/v43-health-management.cjs
      - name: v44 health entry visibility fix
        run: node tests/v44-health-entry-fix.cjs
      - name: v45 육아 hub navigation
        run: node tests/v45-care-hub.cjs
      - name: v46 loader check
        run: node tests/v46-loader.cjs
      - name: v48 PWA installability
        run: node tests/v48-pwa-install.cjs

      - name: v56 stable shell restore
        run: |
          node -e "const fs=require('fs'),a=fs.readFileSync('index.html','utf8'),s=fs.readFileSync('sw.js','utf8'),assert=require('assert'); assert(a.includes('<iframe id=\"app\"')); assert(a.includes('legacy-ui-v47.js?v=20260919-v56')); assert(a.includes('visibility:visible')); assert(!a.includes('v49-ppeuni-data-script')); assert(s.includes("const CACHE='dojun-pwa-v56'")); console.log('PASS: v56 restores stable enhanced shell and forces fresh assets')"

