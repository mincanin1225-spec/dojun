      - name: Simple weekly make checklist
        run: node tests/v70-simple-make-flow.cjs

      - name: Inventory display and family sync schema
        run: node tests/v70-inventory-sync-fix.cjs

      - name: Prepared-only inventory model
        run: node tests/v70-prepared-only-inventory.cjs

      - name: Manual-driven whole app audit
