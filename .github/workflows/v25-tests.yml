name: v26 tests

on:
  pull_request:
    branches: ["main"]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserved v24 core tests
        run: node tests/core.cjs
      - name: v25 prep and cube inventory tests
        run: node tests/ppeuni-core.cjs
      - name: v26 default entry wiring
        run: node tests/v26-entry.cjs
