name: v61 photo inventory import tests

on:
  pull_request:
    branches: ["main"]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserved original app core tests
        run: node tests/core.cjs
      - name: v25 prep and cube inventory tests
        run: node tests/ppeuni-core.cjs
      - name: management stock-shopping-prep logic
        run: node tests/ops-v27.cjs
      - name: v29 management overview and workflow
        run: node tests/v29-management.cjs
      - name: v30 freezer inventory and prep split
        run: node tests/v30-freezer-prep.cjs
      - name: v31 total stock shopping readiness flow
        run: node tests/v31-inventory-flow.cjs
      - name: v32 unified stock entry flow
        run: node tests/v32-stock-entry.cjs
      - name: v33 next-week shopping and prep UX
        run: node tests/v33-management.cjs
      - name: v34 custom ingredient inventory flow
        run: node tests/v34-custom-ingredients.cjs
      - name: v35 batch deduction and next shopping recalculation
        run: node tests/v35-batch-deduct.cjs
      - name: v36 outing and map MVP
        run: node tests/v36-outing-map.cjs
      - name: v37 outing UI and Naver Maps bridge
        run: node tests/v37-outing-polish.cjs
      - name: v38 Naver saved-list auto sync
