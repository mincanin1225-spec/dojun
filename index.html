<title>도준이키우기</title>
<style>html,body{margin:0;height:100%;background:#FFF8F1}#app{border:0;width:100%;height:100dvh;display:block;visibility:hidden;opacity:0;pointer-events:none}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#FFF8F1;color:#7C7065;font:700 14px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;z-index:2}</style>

<body>
<div id="boot">도준이키우기 불러오는 중…</div>
<iframe id="app" src="./legacy-v70.html?r=20260923-v78-fastboot1" title="도준이키우기"></iframe>
<script>
(function(){
  const frame=document.getElementById('app'),boot=document.getElementById('boot');
  let inventoryReady=false,workflowReady=false,failed=false;
  function reveal(){
    if(failed||!inventoryReady||!workflowReady)return;
    frame.style.visibility='visible';frame.style.opacity='1';frame.style.pointerEvents='auto';
    if(boot)boot.style.display='none';
  }
  function failBoot(){
    failed=true;
    if(boot)boot.textContent='앱을 불러오지 못했어요 · 앱을 완전히 종료한 뒤 다시 열어 주세요';
  }
  const bootTimer=setTimeout(failBoot,8000);
  function readyPart(which){
    if(which==='inventory')inventoryReady=true;
    if(which==='workflow')workflowReady=true;
    if(inventoryReady&&workflowReady){clearTimeout(bootTimer);const d=frame.contentDocument;if(d?.documentElement)d.documentElement.dataset.dojunReady='1';reveal()}
  }
  function inject(){
    const d=frame.contentDocument;
    if(!d||!d.head)return;
    if(d.documentElement?.dataset?.dojunReady==='1'){inventoryReady=true;workflowReady=true;clearTimeout(bootTimer);return reveal()}
    if(d.getElementById('v78-management-bundle-script'))return;
    const mg=d.createElement('script');
    mg.id='v78-management-bundle-script';
    mg.src='./legacy-management-v78-bundle.js?r=20260923-v78-fastboot1';
    mg.onload=function(){
                    // 준비 탭에 필요한 핵심 경로는 외출·건강 모듈을 기다리지 않고 먼저 올린다.
                    // 구화면은 숨긴 채 유지하고, 재고 UI + meal workflow가 준비되면 바로 최신 화면을 보여준다.
                    const loadMealCore=function(){
                      const loadWorkflow=function(){
                        if(d.getElementById('v63-meal-workflow-script'))return;
                        const ui=d.createElement('script');
                        ui.id='v63-meal-workflow-script';
                        ui.src='./meal-workflow-v70.js?r=20260923-v78-fastboot1';
                        ui.onload=function(){readyPart('workflow')};
                        ui.onerror=failBoot;
                        d.head.appendChild(ui);
                      };
                      const loadStock=function(){
                        if(d.getElementById('v63-meal-stock-script'))return loadWorkflow();
                        const am=d.createElement('script');
                        am.id='v63-meal-stock-script';
                        am.src='./meal-stock-v66.js?r=20260923-v78-fastboot1';
                        am.onload=loadWorkflow;
                        am.onerror=failBoot;
                        d.head.appendChild(am);
                      };
                      const loadSafe=function(){
                        if(d.getElementById('v58-ppeuni-safe-script'))return loadStock();
                        const al=d.createElement('script');
                        al.id='v58-ppeuni-safe-script';
                        al.src='./legacy-ppeuni-v58-safe.js?v=20260919-v58&r=20260923-v78-fastboot1';
                        al.onload=loadStock;
                        al.onerror=loadStock;
                        d.head.appendChild(al);
                      };
                      if(d.getElementById('v58-ppeuni-data-script'))return loadSafe();
                      const ak=d.createElement('script');
                      ak.id='v58-ppeuni-data-script';
                      ak.src='./src/ppeuni-verified-v49.js?v=20260919-v58&r=20260923-v78-fastboot1';
                      ak.onload=loadSafe;
                      ak.onerror=loadSafe;
                      d.head.appendChild(ak);
                    };
                    const vi=d.createElement('script');
                    vi.id='v61-photo-inventory-script';
                    vi.src='./legacy-inventory-v61-photo.js?v=20260921-v61&r=20260923-v78-fastboot1';
                    vi.onload=function(){readyPart('inventory');loadMealCore()};
                    vi.onerror=failBoot;
                    d.head.appendChild(vi);
                    const x=d.createElement('script');
                    x.id='v36-outing-script';
                    x.src='./legacy-outing-v36.js?v=20260916-v40&r=20260923-v78-fastboot1';
                    x.onload=function(){
                      const y=d.createElement('script');
                      y.id='v37-outing-polish-script';
                      y.src='./legacy-outing-v37.js?v=20260916-v40&r=20260923-v78-fastboot1';
                      y.onload=function(){
                        const z=d.createElement('script');
                        z.id='v38-naver-sync-script';
                        z.src='./legacy-outing-v38.js?v=20260916-v40&r=20260923-v78-fastboot1';
                        z.onload=function(){
                          const aa=d.createElement('script');
                          aa.id='v39-version-map-fix-script';
                          aa.src='./legacy-fixes-v39.js?v=20260916-v40&r=20260923-v78-fastboot1';
                          aa.onload=function(){
                            const ab=d.createElement('script');
                            ab.id='v40-naver-places-script';
                            ab.src='./legacy-outing-v40-seed.js?v=20260916-v40&r=20260923-v78-fastboot1';
                            ab.onload=function(){
                              const ac=d.createElement('script');
                              ac.id='v41-no-embedded-map-script';
                              ac.src='./legacy-outing-v41-no-embedded-map.js?v=20260916-v41&r=20260923-v78-fastboot1';
                              ac.onload=function(){
                                const ad=d.createElement('script');
                                ad.id='v42-outing-priority-script';
                                ad.src='./legacy-outing-v42-priority.js?v=20260916-v42&r=20260923-v78-fastboot1';
                                ad.onload=function(){
                                  const ae=d.createElement('script');
                                  ae.id='v43-health-data-script';
                                  ae.src='./health-schedule-v43.js?v=20260916-v43&r=20260923-v78-fastboot1';
                                  ae.onload=function(){
                                    const af=d.createElement('script');
                                    af.id='v43-health-manager-script';
                                    af.src='./legacy-health-v43.js?v=20260916-v43&r=20260923-v78-fastboot1';
                                    af.onload=function(){
                                      const ag=d.createElement('script');
                                      ag.id='v45-care-hub-script';
                                      ag.src='./legacy-care-v45.js?v=20260916-v45&r=20260923-v78-fastboot1';
                                      ag.onload=function(){
                                        const ah=d.createElement('script');
                                        ah.id='v44-health-entry-fix-script';
                                        ah.src='./legacy-health-v44-entry-fix.js?v=20260916-v44&r=20260923-v78-fastboot1';
                                        ah.onload=function(){
                                          const aj=d.createElement('script');
                                          aj.id='v47-ui-script';
                                          aj.src='./legacy-ui-v47.js?v=20260916-v47&r=20260923-v78-fastboot1';
                                          aj.onload=function(){
                                            if(d.getElementById('v46-health-import-script'))return;
                                            const ai=d.createElement('script');
                                            ai.id='v46-health-import-script';
                                            ai.src='./legacy-health-v46-import.js?v=20260916-v46&r=20260923-v78-fastboot1';
                                            d.head.appendChild(ai);
                                          };
                                          d.head.appendChild(aj);
                                        };
                                        d.head.appendChild(ah);
                                      };
                                      d.head.appendChild(ag);
                                    };
                                    d.head.appendChild(af);
                                  };
                                  d.head.appendChild(ae);
                                };
                                d.head.appendChild(ad);
                              };
                              d.head.appendChild(ac);
                            };
                            d.head.appendChild(ab);
                          };
                          d.head.appendChild(aa);
                        };
                        d.head.appendChild(z);
                      };
                      d.head.appendChild(y);
                    };
                    d.head.appendChild(x);

    };
    mg.onerror=failBoot;
    d.head.appendChild(mg);
  }
  frame.addEventListener('load',inject);
  try{inject()}catch(e){failBoot()}
})();
</script>
<script>
(function(){
  const frame=document.getElementById('app');
  let sheetGuard=false,consumeGuard=false;
  function armSheetGuard(){
    if(sheetGuard)return;
    sheetGuard=true;
    try{history.pushState({dojunSheetGuard:true},'')}catch(e){sheetGuard=false}
  }
  function releaseSheetGuard(){
    if(!sheetGuard)return;
    sheetGuard=false;
    if(history.state&&history.state.dojunSheetGuard){
      consumeGuard=true;
      try{history.back()}catch(e){consumeGuard=false}
      setTimeout(()=>{consumeGuard=false},500);
    }
  }
  addEventListener('message',e=>{
    if(e.source!==frame.contentWindow||e.origin!==location.origin||!e.data)return;
    if(e.data.type==='dojun-sheet-open')armSheetGuard();
    else if(e.data.type==='dojun-sheet-close')releaseSheetGuard();
  });
  addEventListener('popstate',()=>{
    if(consumeGuard){consumeGuard=false;return}
    if(!sheetGuard)return;
    sheetGuard=false;
    try{frame.contentWindow.postMessage({type:'dojun-sheet-back'},location.origin)}catch(e){}
  });
})();
</script>
<script>
(function(){
  if(!('serviceWorker' in navigator))return;
  const RELEASE='20260923-v78-fastboot1',KEY='dojun-sw-release';
  let reloading=false;
  function reloadOnce(){
    if(reloading||localStorage.getItem(KEY)===RELEASE)return;
    reloading=true;localStorage.setItem(KEY,RELEASE);location.reload();
  }
  navigator.serviceWorker.addEventListener('controllerchange',reloadOnce);
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?r='+RELEASE,{updateViaCache:'none'});
      await reg.update();
      if(reg.active&&String(reg.active.scriptURL||'').includes(RELEASE))reloadOnce();
    }catch(e){}
  });
})();
</script>
</body>
