<meta name="apple-mobile-web-app-title" content="도준이 밥상">
<meta name="description" content="도준이 이유식 월간 식단·기록·장보기·영양">
<style>
:root{
  --bg:#FFF8F1; --card:#fff; --line:#F0E6DA; --line2:#F7F0E7;
  --ink:#4A4038; --ink2:#7C7065; --muted:#ADA093;
  --mint:#6FBFA0; --mint-s:#E4F4EC;
  --peach:#F2925C; --peach-s:#FDEADD;
  --berry:#E2809B; --berry-s:#FBE9EE;
  --butter:#F3C65C; --butter-s:#FDF3DA;
  --sky:#77A8D8; --sky-s:#E7F0FA;
  --r:22px; --r2:16px;
  --sh:0 2px 4px rgba(74,64,56,.04),0 10px 24px rgba(74,64,56,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#EFE6DB}
body{font-size:15px;line-height:1.55;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}

#phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;box-shadow:0 0 60px rgba(74,64,56,.09)}
#main{padding:16px 16px 108px}

/* ---- app bar ---- */
.appbar{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--butter-s);flex:none;overflow:hidden;
  display:grid;place-items:center;font-size:22px;border:2px solid #fff;box-shadow:var(--sh);cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.appbar .nm{flex:1;min-width:0}
.appbar h1{font-size:19px;font-weight:800}
.appbar .age{font-size:12.5px;color:var(--peach);font-weight:700}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12.5px;
  color:var(--ink2);font-weight:600;box-shadow:var(--sh)}

/* ---- generic ---- */

function genMonth(y,mo,variant){
  const dim=new Date(y,mo,0).getDate(), rand=rng(y*1e4+mo*137+variant*7919+29);
  const hM=[],hS=[],hF=[],out={};
  for(let d=1;d<=dim;d++){
    const on=`${y}-${pad(mo)}-${pad(d)}`, Q=pools(on), tr=trialOf(on), ST=stage(on);
    if(!Q.P.length||!Q.V.length||!Q.F.length||!Q.FM.length||!Q.SF.length){out[on]=null;continue}
    const strictF=Q.F.length>=3; let day=null;
    for(let rx=0;rx<3&&!day;rx++)for(let at=0;at<40&&!day;at++){
      const meals=[],dp=[],ds=[],df=[],dv=[];let ok=1;
      for(let i=0;i<3;i++){
        let got=null;
        for(let t=0;t<1400&&!got;t++){
          let p=pk(rand,Q.P),form=pk(rand,Q.FM),vg=[pk(rand,Q.V),pk(rand,Q.V)],fr=pk(rand,Q.F);
          if(i===0&&tr){ if(tr.cat==='p')p=tr; else if(tr.cat==='v')vg[0]=tr; else fr=tr; }
          if(vg[0].k===vg[1].k)vg=[vg[0]];
          const sf=pk(rand,Q.SF);
          if(sf.p==='egg'&&!Q.egg)continue;
          if(sf.p==='tofu'&&!Q.tofu)continue;
          if(sf.p==='beef'&&!Q.beef)continue;
          let sv=sf.nv===2?[pk(rand,Q.V),pk(rand,Q.V)]:[pk(rand,Q.V)];
          sv=sv.filter((v,ix)=>sv.findIndex(z=>z.k===v.k)===ix);
          const main={p,v:vg,f:form,fn:fName(form,ST)},side={f:sf,v:sv,p:sf.p||null};
          const mn=nMain(main),sn=nSide(side);
          if(rx<2&&(hM.slice(-14).includes(mn)||hS.slice(-12).includes(sn)||hF.slice(-7).includes(fr.k)))continue;
          if(side.p===p.k)continue;
          if(sv.some(v=>vg.some(x=>x.k===v.k)))continue;
          if(p.k==='shrimp'&&dp.includes('shrimp'))continue;
          if(dp.filter(x=>x===p.k).length>=2)continue;
          if(side.p==='egg'&&ds.includes('egg'))continue;
          if(side.p==='tofu'&&ds.includes('tofu'))continue;
          const av=[...vg,...sv];
          if(av.some(v=>v.ni)&&dv.some(g=>g.some(v=>v.ni)))continue;
          if(av.filter(v=>v.cr).length+dv.reduce((a,g)=>a+g.filter(v=>v.cr).length,0)>2)continue;
          if(av.filter(v=>v.st).length+(fr.st?1:0)>1)continue;
          if(strictF?df.includes(fr.k):df[df.length-1]===fr.k)continue;
          if(strictF&&fr.st&&df.some(k=>(byK[k]||{}).st))continue;
          if(av.some(v=>v.n===(fr.b||fr.n)))continue;
          if(i===2&&rx<1&&Q.P.some(x=>x.red)&&!dp.some(k=>(byK[k]||{}).red)&&!p.red)continue;
          got={main,side,fruit:fr,trial:(i===0&&tr)?tr.k:null};
        }
        if(!got){ok=0;break}
        dp.push(got.main.p.k);if(got.side.p)ds.push(got.side.p);df.push(got.fruit.k);
        dv.push([...got.main.v,...got.side.v]);
        hM.push(nMain(got.main));hS.push(nSide(got.side));hF.push(got.fruit.k);meals.push(got);
      }
      if(ok)day=meals;else hM.length=Math.max(0,hM.length-3);
    }
    out[on]=day;
  }
  return out;
}
const mk=on=>on.slice(0,7);

function mealNut(on,i){
  const m=mObj(on,i); if(!m) return null;
  const A=stage(on), acc=Array(9).fill(0);
  const add=(k,g)=>{const v=N[k];if(!v)return;for(let j=0;j<9;j++)acc[j]+=v[j]*g/100};
  add('rice',A.rice);
  add(m.main.p.k, m.main.p.fish?A.fish:m.main.p.k==='tofu'?A.tofu:A.meat);
  if(m.main.p.with) add(m.main.p.with,A.meat*.5);
  m.main.v.forEach(v=>add(v.k,A.veg));
  m.side.v.forEach(v=>add(v.k,A.veg));

  return acc;
}

function recipe(on,i){
  const m=mObj(on,i);if(!m)return null;
  const A=stage(on),p=m.main.p,ap=p.fish?A.fish:p.k==='tofu'?A.tofu:A.meat,mv=m.main.v,sv=m.side.v,sf=m.side.f,fr=m.fruit;
  const riceStep=A.key==='early'?`쌀 ${A.rice}g을 곱게 갈아 물 10배를 붓고 저어가며 끓인 뒤 체에 거릅니다.`
    :A.key==='mid'?`쌀 ${A.rice}g을 반쯤 갈아 물 6~7배로 무르게 죽을 끓입니다.`
    :`밥 ${A.rice}g에 채소육수 100ml를 붓고 무르게 풀어줍니다.`;
  const prot=p.k==='tofu'?`두부 ${ap}g은 끓는 물에 30초 데쳐 물기를 빼고 으깹니다.`
    :p.fish?`${p.n} ${ap}g은 가시와 껍질을 완전히 제거하고 쪄서 잘게 부숩니다.`
    :`${p.n} ${ap}g은 찬물에 20분 담가 핏물을 빼고 곱게 다져 끓는 물에 완전히 익힙니다.`;
  const fin={jinbap:'냄비에 모두 넣고 중약불에서 5~7분 저어가며 끓입니다.',
    risotto:'재료를 넣고 3~4분 더 끓여 걸쭉하게 만듭니다.',
    bapjjim:'재료를 올려 김 오른 찜기에서 10분간 찝니다.',
    bapbol:'재료를 섞어 아이 한입 크기로 동글게 빚습니다.',
    bapjeon:'쌀가루 1작은술을 섞어 반죽하고 약불에서 앞뒤 2분씩 굽습니다.',
    deopbap:'재료를 물 2큰술과 볶아 걸쭉해지면 밥 위에 얹습니다.',
    jumeokbap:'재료를 밥에 골고루 섞어 한입 크기로 뭉칩니다.'}[m.main.f.k];
  const side={
    eggjjim:[`노른자 1개를 육수 60ml와 섞어 체에 거릅니다.`,`다진 ${sv.map(v=>v.n).join(', ')}를 넣고 찜기에서 8분 익힙니다.`],
    tofujeon:[`두부 ${Math.round(A.tofu*.6)}g의 물기를 짜고 으깹니다.`,`다진 ${sv.map(v=>v.n).join(', ')}와 쌀가루 1작은술을 섞어 약불에 앞뒤 2분씩 굽습니다.`],
    tofubol:[`두부 ${Math.round(A.tofu*.6)}g과 다진 ${sv.map(v=>v.n).join(', ')}, 쌀가루 1작은술을 섞습니다.`,`동글게 빚어 찜기에서 8분 찝니다.`],
    mash:[`${sv.map(v=>`${v.n} ${A.veg}g`).join(', ')}을 무르게 쪄서 으깹니다.`,`모유나 분유물 1큰술로 농도를 맞춥니다.`],
    deulkkae:[`${sv.map(v=>v.n).join(', ')}를 데쳐 물기를 짜고 잘게 썹니다.`,`들깨가루 1/2작은술로 가볍게 무칩니다.`],
    beefbokk:[`다진 소고기 ${Math.round(A.meat*.5)}g과 ${sv.map(v=>v.n).join(', ')}를 물 2큰술과 함께 볶듯 익힙니다.`]
  }[sf.k];

    ings:[`밥 ${A.rice}g`,`${p.n} ${ap}g`,...mv.map(v=>`${v.n} ${A.veg}g`),
      ...(sf.p==='egg'?['노른자 1개']:sf.p==='tofu'?[`두부 ${Math.round(A.tofu*.6)}g`]:sf.p==='beef'?[`소고기 ${Math.round(A.meat*.5)}g`]:[]),
      ...sv.map(v=>`${v.n} ${A.veg}g`),`${fr.b||fr.n} ${A.fruit}g`],
    main:[riceStep,prot,`${mv.map(v=>v.n).join(', ')}은 껍질을 벗겨 ${A.key==='early'?'곱게 갈아':'잘게 다져'} 익힙니다.`,fin,`불을 끄고 참기름이나 들기름 1~2방울을 떨어뜨립니다.`],
    side, fruit:[`${fr.b||fr.n} ${A.fruit}g을 ${fr.prep} 냅니다.`], tex:A.tex
  };
}

function weekList(sun){
  const t={};
  for(let i=0;i<7;i++){const on=addD(sun,i),A=stage(on);
    for(let j=0;j<3;j++){const m=mObj(on,j);if(!m)continue;
      const add=(n,c,g)=>{t[n]=t[n]||{c,g:0,n:0};t[n].g+=g;t[n].n++};
      const p=m.main.p;add(p.n,'p',p.fish?A.fish:p.k==='tofu'?A.tofu:A.meat);
      if(p.with)add(byK[p.with].n,'p',A.meat*.5);
      m.main.v.forEach(v=>add(v.n,'v',A.veg));m.side.v.forEach(v=>add(v.n,'v',A.veg));
      if(m.side.p==='egg')add('계란','p',0);
      if(m.side.p==='tofu')add('두부','p',Math.round(A.tofu*.6));
      if(m.side.p==='beef')add('소고기','p',Math.round(A.meat*.5));
      if(m.side.f.k==='deulkkae')add('들깨가루','e',0);
      add(m.fruit.b||m.fruit.n,m.fruit.st?'v':'f',A.fruit);
    }}
  return t;
}
function icsFor(sun){
  const t=weekList(sun), items=Object.entries(t).map(([n,v])=>v.g?`${n} ${Math.ceil(v.g/10)*10}g`:n).join(', ');
  const d=P(sun); d.setDate(d.getDate()-1); // 전 주 토요일

  const en=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T103000`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//dojun//meal//KO','BEGIN:VEVENT',
    'DTSTART;TZID=Asia/Seoul:'+st,'DTEND;TZID=Asia/Seoul:'+en,'RRULE:FREQ=WEEKLY;BYDAY=SA',
    'SUMMARY:이유식 장보기 — 다음 주 재료','BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY',

}

/* --- 영양 --- */
function vNut(){
  const days=[];for(let i=0;i<7;i++)days.push(addD(weekCur,i));
  const tot=Array(9).fill(0);let n=0;
  days.forEach(on=>{const d=dayNut(on);if(d){n++;for(let j=0;j<9;j++)tot[j]+=d[j]}});
  const avg=n?tot.map(x=>x/n):Array(9).fill(0);
  const A=stage(weekCur), ml=MLV[A.key];
  const fmt=v=>v>=100?Math.round(v):v>=10?v.toFixed(0):v.toFixed(1);
  const rows=NUTS.map(t=>{
    const food=avg[t.i], milk=MILK100[t.i]*ml/100, sum=food+milk, ref=t.ref;
    const fp=Math.min(100,food/ref*100), mp=Math.min(100-fp,milk/ref*100);
    const low=sum<ref*.8;
    return `<div class="nut"><div class="h"><b>${t.n}</b>
      <span>이유식 <em>${fmt(food)}</em> + 수유 ${fmt(milk)} ${t.u} · 기준 ${fmt(ref)}</span></div>
      <div class="tr2"><i class="f${low?' low':''}" style="width:${fp}%"></i><i class="m" style="width:${mp}%"></i></div></div>`}).join('');
  const cats=[
    ['붉은고기',v=>'#F2925C',on=>[0,1,2].filter(i=>{const m=mObj(on,i);return m&&(m.main.p.red||m.side.p==='beef')}).length,1],
    ['생선',v=>'#77A8D8',on=>[0,1,2].filter(i=>{const m=mObj(on,i);return m&&m.main.p.fish}).length,0],
    ['채소',v=>'#6FBFA0',on=>{const s=new Set();[0,1,2].forEach(i=>{const m=mObj(on,i);if(m)[...m.main.v,...m.side.v].forEach(v=>s.add(v.k))});return s.size},4],
    ['과일',v=>'#E2809B',on=>{const s=new Set();[0,1,2].forEach(i=>{const m=mObj(on,i);if(m)s.add(m.fruit.k)});return s.size},2],
    ['지방원',v=>'#F3C65C',on=>[0,1,2].filter(i=>{const m=mObj(on,i);return m&&(m.main.p.fish||m.side.f.fat||m.fruit.fat)}).length,1]
  ];
  const heads=days.map(on=>`<div class="hd">${WD[P(on).getDay()]}</div>`).join('');
  const bal=cats.map(([nm,col,fn,goal])=>{
    const cells=days.map(on=>{const c=fn(on);
      return `<div class="bcell" style="background:${c?col():'var(--line2)'};opacity:${c>=goal?1:c?.5:1};color:${c?'#fff':'var(--muted)'}">${c||''}</div>`}).join('');
    return `<div class="rl">${nm}</div>${cells}`}).join('');
  const e=P(addD(weekCur,6));
  return `<div class="sec"><div class="nav">
      <button class="rd" data-a="wk:-1">‹</button>
      <b>${P(weekCur).getMonth()+1}/${P(weekCur).getDate()} – ${e.getMonth()+1}/${e.getDate()}</b>
      <button class="rd" data-a="wk:1">›</button></div></div>
    <div class="sec" style="margin-top:4px"><h2>하루 평균 영양</h2><span class="more">${A.label} 기준</span></div>
    <div class="card">${rows}
      <div class="lg"><span><i style="background:var(--mint)"></i>이유식 3끼</span>
        <span><i style="background:var(--sky)"></i>수유 ${ml}ml 추정</span>
        <span><i style="background:var(--line2)"></i>남은 몫</span></div></div>
    <p class="hint" style="margin:10px 2px 0">일반 식품성분표로 계산한 <b>추정치</b>예요. 수유는 조제분유 ${ml}ml 기준입니다.
    모유는 철분이 훨씬 낮으니 모유수유 중이라면 이유식에서 철을 더 챙겨주세요.</p>
    <div class="sec"><h2>식단 밸런스</h2><span class="more">한 주</span></div>
    <div class="card"><div class="balgrid"><div></div>${heads}${bal}</div>
      <p class="hint" style="margin-top:10px">숫자는 그날의 끼니 수 또는 가짓수예요. 진한 칸이 하루 목표를 채운 날입니다.
      붉은 고기는 하루 1끼, 채소는 하루 4가지, 과일은 2가지, 지방원은 하루 1끼가 목표예요.</p></div>`;
}

function download(name,text,type){
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
    a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}
}

  if(cmd==='close')return close();
  if(cmd==='today'){cursorM=today;await ensureM(+today.slice(0,4),+today.slice(5,7));return render()}
  if(cmd==='mon'){const y=+cursorM.slice(0,4),m=+cursorM.slice(5,7)+ +arg;const d=new Date(y,m-1,1);
    cursorM=isoOf(d);await ensureM(d.getFullYear(),d.getMonth()+1);return render()}
  if(cmd==='wk'){weekCur=addD(weekCur,7*(+arg));
    for(let i=0;i<7;i++){const on=addD(weekCur,i);await ensureM(+on.slice(0,4),+on.slice(5,7))}
    return render()}
  if(cmd==='day'){await ensureM(+arg.slice(0,4),+arg.slice(5,7));return sheetDay(arg)}
  if(cmd==='rec'){e.stopPropagation();const[on,s,c]=arg.split('|');return setRec(on,s,c)}
  if(cmd==='fd'){const[k,s]=arg.split('|');return setFood(k,s)}
  if(cmd==='fdopen')return sheetFood(arg);
  if(cmd==='chk'){const l=shopChk[weekCur]||(shopChk[weekCur]=[]);
    const i=l.indexOf(arg);i<0?l.push(arg):l.splice(i,1);await store.set('shop2',shopChk);return render()}
  if(cmd==='uncheck'){shopChk[weekCur]=[];await store.set('shop2',shopChk);return render()}
  if(cmd==='allok'){ALL.forEach(x=>{if(stat(x.k)==='new')foods[x.k]={s:'ok',at:today}});
    await store.set('foods2',foods);regenAll();render();return toast('모두 도입 완료로 바꿨어요')}
  if(cmd==='reshuffle'){const k=cursorM.slice(0,7);months[k].d.variant=(months[k].d.variant||0)+1;
    const[y,m]=k.split('-').map(Number);months[k].plan=genMonth(y,m,months[k].d.variant);
    await store.set('m2:'+k,months[k].d);render();return toast('메뉴를 새로 뽑았어요')}
  if(cmd==='clearlogs'){if(!confirm('이 달의 먹은 기록을 모두 지울까요?'))return;
    const k=cursorM.slice(0,7);months[k].d.logs={};await store.set('m2:'+k,months[k].d);render();return toast('지웠어요')}
  if(cmd==='ics'){const t=icsFor(addD(weekCur,7));
    if(!download('이유식-장보기-알림.ics',t,'text/calendar')){open('<h2>캘린더 알림</h2><div class="fld"><textarea rows="8">'+esc(t)+'</textarea></div><p class="hint">이 내용을 .ics 파일로 저장해 캘린더에 넣어주세요.</p><div class="btnrow"><button class="btn" data-a="close">닫기</button></div>')}
    else toast('파일을 열어 캘린더에 추가하세요');return}
  if(cmd==='copy'){const t=weekList(weekCur);
    const txt=Object.entries(t).map(([n,v])=>v.g?`${n} 약 ${Math.ceil(v.g/10)*10}g`:n).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('복사했어요')}catch(err){
      open('<h2>장보기 목록</h2><div class="fld"><textarea rows="12">'+esc(txt)+'</textarea></div><div class="btnrow"><button class="btn" data-a="close">닫기</button></div>')}
    return}
  if(cmd==='avatar')return $('avfile').click();
  if(cmd==='savesettings'){settings.name=$('sN').value.trim()||'우리 아이';settings.birth=$('sB').value;
    await store.set('settings2',settings);regenAll();render();return toast('저장했어요')}
  if(cmd==='savefood'){foods[arg]={...(foods[arg]||{s:stat(arg)}),memo:$('fM').value.trim()};
    await store.set('foods2',foods);close();render();return toast('저장했어요')}
  if(cmd==='savday'){
    const M=months[mk(arg)],base=M.plan[arg],ov=[];let ch=0;
    sheet.querySelectorAll('[data-menu]').forEach(x=>{const i=+x.dataset.menu,v=x.value.trim();
      ov[i]=v;if(v!==(base?nMeal(base[i]):''))ch=1});
    if(ch)M.d.ov[arg]=ov;else delete M.d.ov[arg];
    sheet.querySelectorAll('[data-memo]').forEach(x=>{const s=x.dataset.memo,v=x.value.trim();
      const L=M.d.logs[arg]||(M.d.logs[arg]={}),cur=L[s]||(L[s]={});cur.memo=v;
      if(!cur.memo&&!cur.s)delete L[s];if(!Object.keys(L).length)delete M.d.logs[arg]});
    await saveM(arg);close();render();return toast('저장했어요')}
  if(cmd==='resetday'){const M=months[mk(arg)];delete M.d.ov[arg];await saveM(arg);sheetDay(arg);render();return toast('원래 메뉴로 되돌렸어요')}
  if(cmd==='export'){const dump={settings,foods,shopChk,avatar,
      months:Object.fromEntries(Object.entries(months).map(([k,v])=>[k,v.d]))};
    $('sD').value=JSON.stringify(dump);return toast('아래 칸을 복사해 두세요')}
  if(cmd==='import'){try{const o=JSON.parse($('sD').value);
      if(o.settings){settings=o.settings;await store.set('settings2',settings)}
      if(o.foods){foods=o.foods;await store.set('foods2',foods)}
      if(o.shopChk){shopChk=o.shopChk;await store.set('shop2',shopChk)}
      if(o.avatar){avatar=o.avatar;await store.set('avatar',avatar)}
      if(o.months)for(const[k,v]of Object.entries(o.months))await store.set('m2:'+k,v);
      Object.keys(months).forEach(k=>delete months[k]);await boot();close();return toast('불러왔어요')}
    catch(err){return toast('형식이 올바르지 않아요')}}
});

$('avfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),fr=new FileReader();
  fr.onload=()=>{img.onload=async()=>{
    const s=200,c=document.createElement('canvas');c.width=c.height=s;
    const k=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,s,s);
    avatar=c.toDataURL('image/jpeg',.82);
    await store.set('avatar',avatar);render();toast('사진을 넣었어요')};img.src=fr.result};
  fr.readAsDataURL(f);e.target.value='';
};

/* ══════════ 시작 ══════════ */
async function boot(){
  const s=await store.get('settings2');if(s)settings={...settings,...s};
  const f=await store.get('foods2');if(f)foods=f;
  const sh=await store.get('shop2');if(sh)shopChk=sh;
  const av=await store.get('avatar');if(av)avatar=av;
  for(let i=-10;i<=14;i++){const on=addD(today,i);await ensureM(+on.slice(0,4),+on.slice(5,7))}
  render();
}
boot();
