<style>
:root{
  --bg:#FFF8F1; --card:#fff; --line:#F0E6DA; --line2:#F7F0E7;
  --ink:#4A4038; --ink2:#7C7065; --muted:#ADA093;
  --mint:#6FBFA0; --mint-s:#E4F4EC;
  --peach:#F2925C; --peach-s:#FDEADD;
  --berry:#E2809B; --berry-s:#FBE9EE;
  --butter:#F3C65C; --butter-s:#FDF3DA;
  --sky:#77A8D8; --sky-s:#E7F0FA;
  --r:22px; --r2:16px;
  --sh:0 2px 4px rgba(74,64,56,.04),0 10px 24px rgba(74,64,56,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#EFE6DB}
body{font-size:15px;line-height:1.55;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}

#phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;box-shadow:0 0 60px rgba(74,64,56,.09)}
#main{padding:16px 16px 108px}

/* ---- app bar ---- */
.appbar{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--butter-s);flex:none;overflow:hidden;
  display:grid;place-items:center;font-size:22px;border:2px solid #fff;box-shadow:var(--sh);cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.appbar .nm{flex:1;min-width:0}
.appbar h1{font-size:19px;font-weight:800}
.appbar .age{font-size:12.5px;color:var(--peach);font-weight:700}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12.5px;
  color:var(--ink2);font-weight:600;box-shadow:var(--sh)}

/* ---- generic ---- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.sec{margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2{font-size:15px;font-weight:800}
.sec .more{font-size:12.5px;color:var(--muted);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);line-height:1.65}
.nav{display:flex;align-items:center;gap:4px}
.nav b{font-size:17px;font-weight:800;min-width:118px;text-align:center}
.rd{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--ink2)}
.rd:active{background:var(--line2)}

/* ---- calendar ---- */
.wh{display:grid;grid-template-columns:repeat(7,1fr);margin:4px 0 6px}
.wh span{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.wh span:first-child{color:var(--berry)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:#fff;border-radius:14px;aspect-ratio:1/1.18;padding:5px 3px 4px;display:flex;
  flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(74,64,56,.05)}
.day.blank{background:none;box-shadow:none}
.day .n{font-size:12.5px;font-weight:700;line-height:1}
.day.sun .n{color:var(--berry)}
.day.today{outline:2px solid var(--peach);outline-offset:-2px;background:var(--peach-s)}
.day .dd{display:flex;gap:2.5px}
.day .dd i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.day .dd i.a{background:var(--mint)}.day .dd i.s{background:var(--butter)}.day .dd i.l{background:var(--berry)}
.day .tri{position:absolute}
.day .newdot{width:5px;height:5px;border-radius:50%;background:var(--peach);margin-top:-2px}

/* ---- today strip ---- */
.meal{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.meal:first-child{border-top:0;padding-top:0}
.meal .pic{flex:none;width:64px;height:52px;background:var(--line2);border-radius:14px;overflow:hidden}
.meal .bd{flex:1;min-width:0}
.meal .lb{font-size:11.5px;font-weight:800;color:var(--mint);margin-bottom:2px}
.meal .tt{font-size:14px;line-height:1.45;font-weight:600}
.meal .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.rec{display:flex;gap:6px;margin-top:8px}
.rec button{border:1.5px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;
  color:var(--ink2);font-weight:600}
.rec button[aria-pressed="true"]{color:#fff;border-color:transparent}
.rec .a[aria-pressed="true"]{background:var(--mint)}
.rec .s[aria-pressed="true"]{background:var(--butter);color:#7A5E17}
.rec .l[aria-pressed="true"]{background:var(--berry)}

/* ---- banner ---- */
.banner{border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.banner h3{font-size:14.5px;font-weight:800;margin-bottom:4px}
.banner p{margin:0;font-size:12.5px;line-height:1.65}
.banner .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.banner button{background:#fff;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700}
.b-shop{background:var(--sky-s);color:#31577D}
.b-trial{background:var(--peach-s);color:#8A5127}

/* ---- chips ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;background:var(--line2);color:var(--ink2)}
.chip.ok{background:var(--mint-s);color:#3E7F65}
.chip.new{background:var(--peach-s);color:#9A5A28}
.chip.avoid{background:var(--berry-s);color:#96455C;text-decoration:line-through}
.chip.sm{font-size:11.5px;padding:4px 10px}

/* ---- shopping ---- */
.shop{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line2)}
.shop:first-child{border-top:0}
.shop .bx{width:22px;height:22px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.shop.on .bx{background:var(--mint);border-color:var(--mint)}
.shop.on .bx::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.shop .nm{flex:1;font-size:14px;font-weight:600}
.shop.on .nm{color:var(--muted);text-decoration:line-through}
.shop .qt{font-size:12px;color:var(--muted)}
.catrow{display:flex;align-items:center;gap:7px;margin:16px 0 4px}
.catrow b{font-size:13px;font-weight:800}
.catdot{width:9px;height:9px;border-radius:50%}

/* ---- nutrition ---- */
.nut{padding:12px 0;border-top:1px solid var(--line2)}
.nut:first-child{border-top:0}
.nut .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.nut .h b{font-size:13.5px;font-weight:700}
.nut .h span{font-size:12px;color:var(--muted)}
.nut .h span em{font-style:normal;font-weight:800;color:var(--ink);font-size:14px}
.tr{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.tr2{height:9px;background:var(--line2);border-radius:99px;overflow:hidden;display:flex}
.tr2 i{display:block;height:100%}
.tr2 .f{background:var(--mint)}.tr2 .f.low{background:var(--butter)}.tr2 .m{background:var(--sky);opacity:.55}
.lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted);font-weight:600}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tr i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.tr.low i{background:var(--butter)}.tr.over i{background:var(--berry)}
.balgrid{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;align-items:center}
.balgrid .rl{font-size:10.5px;white-space:nowrap;color:var(--ink2);font-weight:700}
.balgrid .hd{font-size:10.5px;color:var(--muted);text-align:center}
.bcell{height:22px;border-radius:7px;background:var(--line2);display:grid;place-items:center;
  font-size:10px;color:#fff;font-weight:700}

/* ---- bottom nav ---- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:15}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
  color:var(--muted);font-weight:700;padding:2px 0}
.tabbar button[aria-selected="true"]{color:var(--peach)}
.tabbar svg{width:23px;height:23px}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(74,64,56,.4);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  background:var(--bg);border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:19px;font-weight:800}
.sheet .sub{font-size:12.5px;color:var(--muted);margin:2px 0 14px}
.dish{display:flex;gap:13px;margin-bottom:12px}
.dish .pic{width:96px;height:78px;border-radius:16px;background:#fff;flex:none;overflow:hidden;box-shadow:var(--sh)}
.dish .bd{flex:1;min-width:0}
.dish h3{font-size:14.5px;font-weight:800;margin-bottom:5px}
.steps{margin:10px 0 0;padding-left:17px}
.steps li{font-size:13px;line-height:1.6;margin-bottom:3px;color:var(--ink2)}
.fld{margin:10px 0}
.fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;
  font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--peach)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:9px 17px;font-size:13px;font-weight:700;color:var(--ink2)}
.btn.pri{background:var(--peach);border-color:var(--peach);color:#fff}
.btn.warn{color:var(--berry);border-color:#F2D8E0}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:var(--ink);
  color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:99px;opacity:0;
  pointer-events:none;transition:.2s;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 12px}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="phone">
  <div id="bar"></div>
  <div id="main"><div class="loading">불러오는 중…</div></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="errbox" onclick="this.style.display='none';this.textContent=''"
  style="position:fixed;top:8px;left:8px;right:8px;z-index:999;background:#8C2F1E;
  color:#fff;font-size:11.5px;line-height:1.5;padding:10px 12px;border-radius:12px;display:none;
  word-break:break-all;max-height:40vh;overflow:auto"></div>
<div id="upd" style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  z-index:50;background:#4A4038;color:#fff;font-size:13px;padding:11px 16px;display:none;
  align-items:center;gap:10px;justify-content:space-between">
  <span id="updtxt">새 버전이 있어요</span>
  <button id="updbtn" style="background:#fff;color:#4A4038;border:0;border-radius:99px;
    padding:6px 14px;font-weight:700;font-size:12.5px;flex:none">지금 새로고침</button>
</div>
<input type="file" id="avfile" accept="image/*" style="display:none">

<script>
/* ══════════ 저장소 ══════════ */
const APP_VER='v15';
var lastTap='-';
const LS={
  get(k){const v=localStorage.getItem('dj:'+k);return v?JSON.parse(v):null},
  set(k,v){localStorage.setItem('dj:'+k,JSON.stringify(v))}
};
const store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k);return r?JSON.parse(r.value):null} }catch(e){}
    try{ return LS.get(k) }catch(e){ return null }
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,JSON.stringify(v)) } }catch(e){}
    try{ LS.set(k,v) }catch(e){}
    syncPush(k,v);
  }
};

/* ══════════ 가족 공유 (Firebase 실시간 데이터베이스) ══════════ */
let sync={url:'',code:''}, es=null, online=false, rt=null, syncFail=false;
const SYNCABLE=k=>k==='settings2'||k==='foods2'||k==='shop2'||k==='avatar'||k.indexOf('m2:')===0;
const rkOf=k=>k.replace(':','__'), kOf=rk=>rk.replace('__',':');
const famURL=seg=>sync.url.replace(/\/+$/,'')+'/fam/'+sync.code+(seg?'/'+seg:'')+'.json';
function newCode(){
  const a=new Uint8Array(16); (crypto.getRandomValues?crypto:{getRandomValues:x=>x}).getRandomValues(a);
  return [...a].map(b=>('0'+b.toString(16)).slice(-2)).join('');
}
function syncPush(k,v){
  if(!online||!sync.url||!sync.code||!SYNCABLE(k))return;
  try{fetch(famURL(rkOf(k)),{method:'PUT',body:JSON.stringify(v)}).catch(()=>{})}catch(e){}
}
function applyRemote(rk,val){
  if(val==null)return false;
  const k=kOf(rk);
  if(!SYNCABLE(k))return false;
  try{if(JSON.stringify(LS.get(k))===JSON.stringify(val))return false}catch(e){}
  try{LS.set(k,val)}catch(e){}
  try{if(window.storage)window.storage.set(k,JSON.stringify(val))}catch(e){}
  if(k==='settings2'){const ob=settings.birth;settings={...settings,...val};if(ob!==settings.birth)Object.keys(months).forEach(x=>delete months[x])}
  else if(k==='foods2'){foods=val;Object.keys(months).forEach(x=>delete months[x])}
  else if(k==='shop2')shopChk=val;
  else if(k==='avatar')avatar=val;
  else if(k.indexOf('m2:')===0){const mk2=k.slice(3);
    val.ov=val.ov||{};val.logs=val.logs||{};val.del=val.del||{};
    if(months[mk2]){const ov=months[mk2].d.variant||0;months[mk2].d=val;
      if((val.variant||0)!==ov)delete months[mk2]}}
  return true;
}
function scheduleRender(){clearTimeout(rt);rt=setTimeout(async()=>{
  const y=+today.slice(0,4),m=+today.slice(5,7);
  if(!months[`${y}-${pad(m)}`])await ensureM(y,m);
  render(true)},250)}
async function pushAllLocal(remote){
  const keys=['settings2','foods2','shop2','avatar'];
  try{for(let i=0;i<localStorage.length;i++){const kk=localStorage.key(i);
    if(kk&&kk.indexOf('dj:m2:')===0)keys.push(kk.slice(3))}}catch(e){}
  for(const k of keys){
    if(remote&&remote[rkOf(k)]!==undefined)continue;
    const v=LS.get(k); if(v!=null) syncPush(k,v);
  }
}
function syncStop(){try{if(es)es.close()}catch(e){}es=null;online=false}
function syncStart(){
  syncStop(); syncFail=false;
  if(!sync.url||!sync.code)return;
  try{es=new EventSource(famURL(''))}catch(e){return}
  let fails=0;
  const handle=ev=>{
    let m,changed=false;try{m=JSON.parse(ev.data)}catch(e){return}
    fails=0;
    if(m.path==='/'){
      const d=m.data||{};
      for(const rk in d){if(applyRemote(rk,d[rk]))changed=true}
      const was=online; online=true; if(!was)changed=true;
      pushAllLocal(d);
    }else{
      const seg=m.path.replace(/^\//,'').split('/')[0];
      if(m.path.split('/').length>2){
        fetch(famURL(seg)).then(r=>r.json()).then(v=>{if(applyRemote(seg,v))scheduleRender()}).catch(()=>{});
        return;
      }
      changed=applyRemote(seg,m.data);
    }
    if(changed)scheduleRender();
  };
  es.addEventListener('put',handle);
  es.addEventListener('patch',handle);
  es.onopen=()=>{fails=0};
  /* 연결이 안 되면 화면을 계속 다시 그리지 않는다 */
  es.onerror=()=>{
    const was=online; online=false;
    if(++fails>=4){syncStop();syncFail=true}
    if(was||syncFail)scheduleRender();
  };
}

/* ══════════ 재료 · 영양 (100g 기준 추정치) ══════════
   [kcal, 단백질g, 지방g, 탄수g, 철mg, 칼슘mg, 아연mg, 비타민A µgRAE, 비타민C mg] */
const N={
  rice:[130,2.5,.3,28,.2,5,.5,0,0],
  beef:[150,21,7,0,2.4,5,4.3,0,0], chicken:[110,23,1.5,0,.5,5,.9,10,0],
  pork:[145,21,6,0,.9,5,2,2,.5], salmon:[180,20,11,0,.5,12,.4,15,0],
  cod:[80,18,.7,0,.3,15,.4,10,1], shrimp:[95,20,1,0,1,60,1.3,15,0],
  tofu:[85,8.5,5,2,1.5,130,.8,0,0], lentil:[115,9,.4,20,3.3,19,1.3,0,1.5],
  egg:[320,16,27,3.6,2.7,130,2.3,380,0],
  zucchini:[20,1.2,.2,3.5,.4,16,.3,10,17], carrot:[35,.9,.2,8,.3,30,.2,835,6],
  onion:[40,1.1,.1,9,.2,23,.2,0,7], potato:[75,2,.1,17,.8,10,.3,0,15],
  sweetpotato:[110,1.3,.1,26,.6,25,.3,700,15], pumpkin:[45,1.5,.1,10,.5,20,.3,400,10],
  broccoli:[35,3,.4,7,.7,47,.4,60,90], cauliflower:[25,2,.3,5,.4,22,.3,0,48],
  cabbage:[25,1.3,.1,6,.5,40,.2,5,36], napa:[15,1.2,.1,2,.3,50,.2,15,25],
  spinach:[25,3,.4,3.6,2.7,90,.5,470,30], chungkyung:[15,1.5,.2,2,.8,105,.2,220,45],
  vitamin:[20,2,.3,3,1.2,120,.3,300,60], mushroom:[25,3,.3,4,.5,3,.5,0,2],
  radish:[18,.6,.1,4,.2,25,.1,0,15], paprika:[30,1,.3,6,.4,10,.2,150,130],
  eggplant:[22,1,.2,5,.3,12,.2,3,3],
  pear:[50,.3,.1,13,.1,4,.1,0,4], apple:[55,.3,.2,14,.1,5,.1,3,4],
  banana:[90,1.1,.3,23,.3,6,.2,3,9], blueberry:[57,.7,.3,14,.3,6,.2,3,10],
  peach:[40,.9,.2,10,.3,5,.2,16,7], grape:[65,.6,.2,17,.3,10,.1,3,3],
  avocado:[160,2,15,9,.6,12,.6,7,10], ssStick:[110,1.3,.1,26,.6,25,.3,700,15],
  pkPiece:[45,1.5,.1,10,.5,20,.3,400,10], deulkkae:[500,18,40,15,10,600,4,0,0],
  oil:[900,0,100,0,0,0,0,0,0]
};
/* 조제분유 100ml 추정치 (모유는 철이 훨씬 낮습니다) */
const MILK100=[67,1.4,3.5,7.5,.8,55,.5,60,8];
const MLV={early:750,mid:650,late:550,comp:450};
const NUTS=[
  {k:'kcal',n:'열량',u:'kcal',ref:700,i:0},
  {k:'prot',n:'단백질',u:'g',ref:15,i:1},
  {k:'fat', n:'지방',u:'g',ref:25,i:2},
  {k:'iron',n:'철',u:'mg',ref:6,i:4,watch:1},
  {k:'ca',  n:'칼슘',u:'mg',ref:300,i:5},
  {k:'zn',  n:'아연',u:'mg',ref:3,i:6},

}

function recipe(on,i){
  const m=mObj(on,i);if(!m)return null;
  const A=stage(on),p=m.main.p,ap=p.fish?A.fish:p.k==='tofu'?A.tofu:A.meat,mv=m.main.v,sv=m.side.v,sf=m.side.f,fr=m.fruit;
  const riceStep=A.key==='early'?`쌀 ${A.rice}g을 곱게 갈아 물 10배를 붓고 저어가며 끓인 뒤 체에 거릅니다.`
    :A.key==='mid'?`쌀 ${A.rice}g을 반쯤 갈아 물 6~7배로 무르게 죽을 끓입니다.`
    :`밥 ${A.rice}g에 채소육수 100ml를 붓고 무르게 풀어줍니다.`;
  const prot=p.k==='tofu'?`두부 ${ap}g은 끓는 물에 30초 데쳐 물기를 빼고 으깹니다.`
    :p.fish?`${p.n} ${ap}g은 가시와 껍질을 완전히 제거하고 쪄서 잘게 부숩니다.`
    :`${p.n} ${ap}g은 찬물에 20분 담가 핏물을 빼고 곱게 다져 끓는 물에 완전히 익힙니다.`;
  const fin={jinbap:'냄비에 모두 넣고 중약불에서 5~7분 저어가며 끓입니다.',
    risotto:'재료를 넣고 3~4분 더 끓여 걸쭉하게 만듭니다.',
    bapjjim:'재료를 올려 김 오른 찜기에서 10분간 찝니다.',
    bapbol:'재료를 섞어 아이 한입 크기로 동글게 빚습니다.',
    bapjeon:'쌀가루 1작은술을 섞어 반죽하고 약불에서 앞뒤 2분씩 굽습니다.',
    deopbap:'재료를 물 2큰술과 볶아 걸쭉해지면 밥 위에 얹습니다.',
    jumeokbap:'재료를 밥에 골고루 섞어 한입 크기로 뭉칩니다.'}[m.main.f.k];
  const side={
    eggjjim:[`노른자 1개를 육수 60ml와 섞어 체에 거릅니다.`,`다진 ${sv.map(v=>v.n).join(', ')}를 넣고 찜기에서 8분 익힙니다.`],
    tofujeon:[`두부 ${Math.round(A.tofu*.6)}g의 물기를 짜고 으깹니다.`,`다진 ${sv.map(v=>v.n).join(', ')}와 쌀가루 1작은술을 섞어 약불에 앞뒤 2분씩 굽습니다.`],
    tofubol:[`두부 ${Math.round(A.tofu*.6)}g과 다진 ${sv.map(v=>v.n).join(', ')}, 쌀가루 1작은술을 섞습니다.`,`동글게 빚어 찜기에서 8분 찝니다.`],
    mash:[`${sv.map(v=>`${v.n} ${A.veg}g`).join(', ')}을 무르게 쪄서 으깹니다.`,`모유나 분유물 1큰술로 농도를 맞춥니다.`],
    deulkkae:[`${sv.map(v=>v.n).join(', ')}를 데쳐 물기를 짜고 잘게 썹니다.`,`들깨가루 1/2작은술로 가볍게 무칩니다.`],
    beefbokk:[`다진 소고기 ${Math.round(A.meat*.5)}g과 ${sv.map(v=>v.n).join(', ')}를 물 2큰술과 함께 볶듯 익힙니다.`]
  }[sf.k];
  return{
    ings:[`밥 ${A.rice}g`,`${p.n} ${ap}g`,...mv.map(v=>`${v.n} ${A.veg}g`),
      ...(sf.p==='egg'?['노른자 1개']:sf.p==='tofu'?[`두부 ${Math.round(A.tofu*.6)}g`]:sf.p==='beef'?[`소고기 ${Math.round(A.meat*.5)}g`]:[]),
      ...sv.map(v=>`${v.n} ${A.veg}g`),`${fr.b||fr.n} ${A.fruit}g`],
    main:[riceStep,prot,`${mv.map(v=>v.n).join(', ')}은 껍질을 벗겨 ${A.key==='early'?'곱게 갈아':'잘게 다져'} 익힙니다.`,fin,`불을 끄고 참기름이나 들기름 1~2방울을 떨어뜨립니다.`],
    side, fruit:[`${fr.b||fr.n} ${A.fruit}g을 ${fr.prep} 냅니다.`], tex:A.tex
  };
}

/* ══════════ 장보기 ══════════ */
function weekList(sun){
  const t={};
  for(let i=0;i<7;i++){const on=addD(sun,i),A=stage(on);
    for(let j=0;j<3;j++){const m=mObj(on,j);if(!m)continue;
      const add=(n,c,g)=>{t[n]=t[n]||{c,g:0,n:0};t[n].g+=g;t[n].n++};
      const p=m.main.p;add(p.n,'p',p.fish?A.fish:p.k==='tofu'?A.tofu:A.meat);
      if(p.with)add(byK[p.with].n,'p',A.meat*.5);
      m.main.v.forEach(v=>add(v.n,'v',A.veg));m.side.v.forEach(v=>add(v.n,'v',A.veg));
      if(m.side.p==='egg')add('계란','p',0);
      if(m.side.p==='tofu')add('두부','p',Math.round(A.tofu*.6));
      if(m.side.p==='beef')add('소고기','p',Math.round(A.meat*.5));
      if(m.side.f.k==='deulkkae')add('들깨가루','e',0);
      add(m.fruit.b||m.fruit.n,m.fruit.st?'v':'f',A.fruit);
    }}
  return t;
}
function icsFor(sun){
  const t=weekList(sun), items=Object.entries(t).map(([n,v])=>v.g?`${n} ${Math.ceil(v.g/10)*10}g`:n).join(', ');
  const d=P(sun); d.setDate(d.getDate()-1); // 전 주 토요일
  const st=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T100000`;
  const en=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T103000`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//dojun//meal//KO','BEGIN:VEVENT',
    'DTSTART;TZID=Asia/Seoul:'+st,'DTEND;TZID=Asia/Seoul:'+en,'RRULE:FREQ=WEEKLY;BYDAY=SA',
    'SUMMARY:이유식 장보기 — 다음 주 재료','BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY',
    'DESCRIPTION:장보기','END:VALARM',
    'DESCRIPTION:'+items.replace(/,/g,'\\,').slice(0,600),'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

function vNut(){
  const days=[];for(let i=0;i<7;i++)days.push(addD(weekCur,i));
  const tot=Array(9).fill(0);let n=0;
  days.forEach(on=>{const d=dayNut(on);if(d){n++;for(let j=0;j<9;j++)tot[j]+=d[j]}});
  const avg=n?tot.map(x=>x/n):Array(9).fill(0);
  const A=stage(weekCur), ml=MLV[A.key];
  const fmt=v=>v>=100?Math.round(v):v>=10?v.toFixed(0):v.toFixed(1);
  const rows=NUTS.map(t=>{
    const food=avg[t.i], milk=MILK100[t.i]*ml/100, sum=food+milk, ref=t.ref;
    const fp=Math.min(100,food/ref*100), mp=Math.min(100-fp,milk/ref*100);
    const low=sum<ref*.8;
    return `<div class="nut"><div class="h"><b>${t.n}</b>
      <span>이유식 <em>${fmt(food)}</em> + 수유 ${fmt(milk)} ${t.u} · 기준 ${fmt(ref)}</span></div>
      <div class="tr2"><i class="f${low?' low':''}" style="width:${fp}%"></i><i class="m" style="width:${mp}%"></i></div></div>`}).join('');
  const cats=[

    ['생선',v=>'#77A8D8',on=>[0,1,2].filter(i=>{const m=mObj(on,i);return m&&m.main.p.fish}).length,0],
    ['채소',v=>'#6FBFA0',on=>{const s=new Set();[0,1,2].forEach(i=>{const m=mObj(on,i);if(m)[...m.main.v,...m.side.v].forEach(v=>s.add(v.k))});return s.size},4],
    ['과일',v=>'#E2809B',on=>{const s=new Set();[0,1,2].forEach(i=>{const m=mObj(on,i);if(m)s.add(m.fruit.k)});return s.size},2],
    ['지방원',v=>'#F3C65C',on=>[0,1,2].filter(i=>{const m=mObj(on,i);return m&&(m.main.p.fish||m.side.f.fat||m.fruit.fat)}).length,1]
  ];
  const heads=days.map(on=>`<div class="hd">${WD[P(on).getDay()]}</div>`).join('');

    const cells=days.map(on=>{const c=fn(on);

    return `<div class="rl">${nm}</div>${cells}`}).join('');
  const e=P(addD(weekCur,6));
  return `<div class="sec"><div class="nav">
      <button class="rd" data-a="wk:-1">‹</button>
      <b>${P(weekCur).getMonth()+1}/${P(weekCur).getDate()} – ${e.getMonth()+1}/${e.getDate()}</b>
      <button class="rd" data-a="wk:1">›</button></div></div>
    <div class="sec" style="margin-top:4px"><h2>하루 평균 영양</h2><span class="more">${A.label} 기준</span></div>
    <div class="card">${rows}
      <div class="lg"><span><i style="background:var(--mint)"></i>이유식 3끼</span>
        <span><i style="background:var(--sky)"></i>수유 ${ml}ml 추정</span>
        <span><i style="background:var(--line2)"></i>남은 몫</span></div></div>
    <p class="hint" style="margin:10px 2px 0">일반 식품성분표로 계산한 <b>추정치</b>예요. 수유는 조제분유 ${ml}ml 기준입니다.
    모유는 철분이 훨씬 낮으니 모유수유 중이라면 이유식에서 철을 더 챙겨주세요.</p>
    <div class="sec"><h2>식단 밸런스</h2><span class="more">한 주</span></div>
    <div class="card"><div class="balgrid"><div></div>${heads}${bal}</div>
      <p class="hint" style="margin-top:10px">숫자는 그날의 끼니 수 또는 가짓수예요. 진한 칸이 하루 목표를 채운 날입니다.
      붉은 고기는 하루 1끼, 채소는 하루 4가지, 과일은 2가지, 지방원은 하루 1끼가 목표예요.</p></div>`;
}

/* ══════════ 시트 ══════════ */
const sheet=$('sheet'),scrim=$('scrim');
let sheetOpen=false, sheetHist=false, skipPop=false;
function open(h){sheet.innerHTML='<div class="grab"></div>'+h;sheet.classList.add('on');scrim.classList.add('on');
  sheet.scrollTop=0;
  if(!sheetOpen){sheetOpen=true;
    try{history.pushState({app:'sheet'},'');sheetHist=true}catch(e){sheetHist=false}}}
function blurAll(){try{const a=document.activeElement;if(a&&a.blur&&a!==document.body)a.blur()}catch(e){}}
function closeNow(){
  blurAll();
  sheet.classList.remove('on');scrim.classList.remove('on');sheetOpen=false;
  setTimeout(()=>{if(!sheetOpen){sheet.innerHTML='';try{window.scrollTo(0,0)}catch(e){}}},220);
}
/* 화면은 무조건 먼저 닫고, 뒤로가기 기록만 정리한다 */
function close(){
  const had=sheetHist; sheetHist=false;
  closeNow();
  if(had){skipPop=true;try{history.back()}catch(e){skipPop=false}
    setTimeout(()=>{skipPop=false},400)}
}
scrim.onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
/* 뒤로가기로 앱이 꺼지지 않게 */
addEventListener('popstate',e=>{
  if(skipPop){skipPop=false;return}
  if(sheetOpen){sheetHist=false;closeNow();return}
  const st=e.state||{}, t=(st.app==='tab'&&st.tab)?st.tab:'cal';
  if(t!==tab){tab=t;render()}
});
/* 혹시 덮개가 남아 있으면 어디를 눌러도 풀리게 */
scrim.addEventListener('touchstart',()=>close(),{passive:true});
/* 덮개만 남아 화면이 잠기면 스스로 푼다 */
function unstick(){
  if(!sheetOpen&&scrim.classList.contains('on')){scrim.classList.remove('on');sheet.classList.remove('on')}
}
document.addEventListener('pointerdown',unstick,true);
document.addEventListener('touchstart',unstick,{capture:true,passive:true});
setInterval(unstick,1000);
try{ if(window.visualViewport) visualViewport.addEventListener('resize',()=>{
  if(!sheetOpen){try{window.scrollTo(0,0)}catch(e){}}
});}catch(e){}

    ${nutLine?`<div class="card" style="margin-bottom:12px"><div class="hint"><b style="color:var(--ink)">이 날 영양(추정)</b><br>${nutLine}</div></div>`:''}
    ${meals}
    <div class="card"><div class="hint">${esc(A.tex)}<br>간은 하지 않습니다. 고기·생선·계란은 속까지 완전히 익히고, 과일과 채소는 잇몸으로 뭉갤 수 있을 만큼 무르게. 먹는 동안에는 꼭 앉혀서 지켜봐 주세요.</div></div>

let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1700)};
async function setRec(on,s,c){
  const M=months[mk(on)],L=M.d.logs[on]||(M.d.logs[on]={}),cur=L[s]||(L[s]={});
  cur.s=cur.s===c?null:c;
  if(!cur.s&&!cur.memo)delete L[s];
  if(!Object.keys(L).length)delete M.d.logs[on];
  await saveM(on);render();
  if(sheet.classList.contains('on')&&sheet.querySelector('[data-menu]'))sheetDay(on);
}
async function setFood(k,s){foods[k]={...(foods[k]||{}),s,at:today};await store.set('foods2',foods);
  regenAll();close();render();toast(s==='ok'?'도입 완료로 옮겼어요':s==='avoid'?'식단에서 뺐어요':'미도입으로 되돌렸어요')}

function download(name,text,type){
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
    a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const [cmd,arg]=el.dataset.a.split(':');
  if(cmd==='tab'){
    if(sheetOpen){sheetHist=false;closeNow();try{history.replaceState({app:'tab',tab:arg},'')}catch(e){}}
    else if(tab!==arg){try{history.pushState({app:'tab',tab:arg},'')}catch(e){}}
    tab=arg;return render()}
  if(cmd==='close')return close();
  if(cmd==='today'){cursorM=today;await ensureM(+today.slice(0,4),+today.slice(5,7));return render()}
  if(cmd==='mon'){const y=+cursorM.slice(0,4),m=+cursorM.slice(5,7)+ +arg;const d=new Date(y,m-1,1);
    cursorM=isoOf(d);await ensureM(d.getFullYear(),d.getMonth()+1);return render()}
  if(cmd==='wk'){weekCur=addD(weekCur,7*(+arg));
    for(let i=0;i<7;i++){const on=addD(weekCur,i);await ensureM(+on.slice(0,4),+on.slice(5,7))}
    return render()}
  if(cmd==='day'){await ensureM(+arg.slice(0,4),+arg.slice(5,7));return sheetDay(arg)}
  if(cmd==='rec'){e.stopPropagation();const[on,s,c]=arg.split('|');return setRec(on,s,c)}
  if(cmd==='fd'){const[k,s]=arg.split('|');return setFood(k,s)}
  if(cmd==='fdopen')return sheetFood(arg);
  if(cmd==='chk'){const l=shopChk[weekCur]||(shopChk[weekCur]=[]);
    const i=l.indexOf(arg);i<0?l.push(arg):l.splice(i,1);await store.set('shop2',shopChk);return render()}
  if(cmd==='uncheck'){shopChk[weekCur]=[];await store.set('shop2',shopChk);return render()}
  if(cmd==='allok'){ALL.forEach(x=>{if(stat(x.k)==='new')foods[x.k]={s:'ok',at:today}});
    await store.set('foods2',foods);regenAll();render();return toast('모두 도입 완료로 바꿨어요')}
  if(cmd==='reshuffle'){const k=cursorM.slice(0,7);months[k].d.variant=(months[k].d.variant||0)+1;
    const[y,m]=k.split('-').map(Number);const v=months[k].d.variant;
    months[k].plan=genMonth(y,m,v);cachePlan(k,v,months[k].plan);
    await store.set('m2:'+k,months[k].d);render();return toast('메뉴를 새로 뽑았어요')}
  if(cmd==='clearlogs'){if(!confirm('이 달의 먹은 기록을 모두 지울까요?'))return;
    const k=cursorM.slice(0,7);months[k].d.logs={};await store.set('m2:'+k,months[k].d);render();return toast('지웠어요')}
  if(cmd==='ics'){const t=icsFor(addD(weekCur,7));
    if(!download('이유식-장보기-알림.ics',t,'text/calendar')){open('<h2>캘린더 알림</h2><div class="fld"><textarea rows="8">'+esc(t)+'</textarea></div><p class="hint">이 내용을 .ics 파일로 저장해 캘린더에 넣어주세요.</p><div class="btnrow"><button class="btn" data-a="close">닫기</button></div>')}
    else toast('파일을 열어 캘린더에 추가하세요');return}
  if(cmd==='copy'){const t=weekList(weekCur);
    const txt=Object.entries(t).map(([n,v])=>v.g?`${n} 약 ${Math.ceil(v.g/10)*10}g`:n).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('복사했어요')}catch(err){
      open('<h2>장보기 목록</h2><div class="fld"><textarea rows="12">'+esc(txt)+'</textarea></div><div class="btnrow"><button class="btn" data-a="close">닫기</button></div>')}
    return}
  if(cmd==='avatar')return $('avfile').click();
  if(cmd==='savesettings'){settings.name=$('sN').value.trim()||'우리 아이';settings.birth=$('sB').value;
    await store.set('settings2',settings);regenAll();render();return toast('저장했어요')}
  if(cmd==='savefood'){foods[arg]={...(foods[arg]||{s:stat(arg)}),memo:$('fM').value.trim()};
    await store.set('foods2',foods);close();render();return toast('저장했어요')}
  if(cmd==='savday'){
    const M=fixM(months[mk(arg)]);if(!M)return;const base=M.plan[arg],del=isDel(arg),ov=[];let ch=0;
    sheet.querySelectorAll('[data-menu]').forEach(x=>{const i=+x.dataset.menu,v=x.value.trim();
      ov[i]=v;if(v!==(del?'':(base?nMeal(base[i]):'')))ch=1});
    if(ch)M.d.ov[arg]=ov;else delete M.d.ov[arg];
    sheet.querySelectorAll('[data-memo]').forEach(x=>{const s=x.dataset.memo,v=x.value.trim();
      const L=M.d.logs[arg]||(M.d.logs[arg]={}),cur=L[s]||(L[s]={});cur.memo=v;
      if(!cur.memo&&!cur.s)delete L[s];if(!Object.keys(L).length)delete M.d.logs[arg]});
    blurAll();
    await saveM(arg);
    setTimeout(()=>{close();render();toast('저장했어요')},160);
    return}
  if(cmd==='delday'){const M=fixM(months[mk(arg)]);if(!M)return;M.d.del[arg]=1;
    delete M.d.ov[arg];delete M.d.logs[arg];await saveM(arg);close();render();return toast('이 날 식단을 지웠어요')}
  if(cmd==='undelday'){const M=fixM(months[mk(arg)]);if(!M)return;delete M.d.del[arg];
    await saveM(arg);render();if(sheetOpen)sheetDay(arg);return toast('식단을 되살렸어요')}
  if(cmd==='delbefore'){
    const d0=P(arg);
    if(!confirm(`${d0.getMonth()+1}월 ${d0.getDate()}일 이전의 식단과 기록을 모두 지울까요?`))return;
    const y=+arg.slice(0,4),m=+arg.slice(5,7);
    for(let k=0;k<3;k++){const dd=new Date(y,m-1-k,1);await ensureM(dd.getFullYear(),dd.getMonth()+1)}
    const touched=new Set();
    for(const key in months){const M=fixM(months[key]);
      for(const on in M.plan){ if(on<arg){M.d.del[on]=1;
        delete M.d.ov[on];delete M.d.logs[on];touched.add(key)} }}
    for(const key of touched)await store.set('m2:'+key,months[key].d);
    close();render();return toast('이전 식단을 모두 지웠어요')}
  if(cmd==='resetday'){const M=fixM(months[mk(arg)]);if(!M)return;delete M.d.ov[arg];await saveM(arg);sheetDay(arg);render();return toast('원래 메뉴로 되돌렸어요')}

  if(cmd==='checkver'){

    }catch(e){return toast('확인하지 못했어요')}}
  if(cmd==='export'){const dump={settings,foods,shopChk,avatar,
      months:Object.fromEntries(Object.entries(months).map(([k,v])=>[k,v.d]))};
    $('sD').value=JSON.stringify(dump);return toast('아래 칸을 복사해 두세요')}

      if(o.settings){settings=o.settings;await store.set('settings2',settings)}

      Object.keys(months).forEach(k=>delete months[k]);await boot();

$('avfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),fr=new FileReader();
  fr.onload=()=>{img.onload=async()=>{
    const s=200,c=document.createElement('canvas');c.width=c.height=s;
    const k=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,s,s);
    avatar=c.toDataURL('image/jpeg',.82);
    await store.set('avatar',avatar);render();toast('사진을 넣었어요')};img.src=fr.result};
  fr.readAsDataURL(f);e.target.value='';
};

const idle=window.requestIdleCallback||(f=>setTimeout(f,120));
async function boot(){
  try{history.replaceState({app:'tab',tab:'cal'},'')}catch(e){}
  const s=await store.get('settings2');if(s)settings={...settings,...s};
  const f=await store.get('foods2');if(f)foods=f;
  const sh=await store.get('shop2');if(sh)shopChk=sh;
  const av=await store.get('avatar');if(av)avatar=av;
  const sy=await store.get('sync');if(sy&&sy.url){sync=sy;syncStart()}
  const y=+today.slice(0,4),m=+today.slice(5,7);
  render();
  await ensureM(y,m);
  render(true);
  /* 앞뒤 달은 화면을 띄운 뒤 여유 있을 때 준비한다 */
  idle(async()=>{
    const a=new Date(y,m-2,1),b=new Date(y,m,1);
    await ensureM(a.getFullYear(),a.getMonth()+1);
    await ensureM(b.getFullYear(),b.getMonth()+1);
    render(true);
  });
}
