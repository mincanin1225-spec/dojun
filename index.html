<script>
(function(){
  const frame=document.getElementById('app');
  let sheetGuard=false,consumeGuard=false;
  function armSheetGuard(){
    if(sheetGuard)return;
    sheetGuard=true;
    try{history.pushState({dojunSheetGuard:true},'')}catch(e){sheetGuard=false}
  }
  function releaseSheetGuard(){
    if(!sheetGuard)return;
    sheetGuard=false;
    if(history.state&&history.state.dojunSheetGuard){
      consumeGuard=true;
      try{history.back()}catch(e){consumeGuard=false}
      setTimeout(()=>{consumeGuard=false},500);
    }
  }
  addEventListener('message',e=>{
    if(e.source!==frame.contentWindow||e.origin!==location.origin||!e.data)return;
    if(e.data.type==='dojun-sheet-open')armSheetGuard();
    else if(e.data.type==='dojun-sheet-close')releaseSheetGuard();
  });
  addEventListener('popstate',()=>{
    if(consumeGuard){consumeGuard=false;return}
    if(!sheetGuard)return;
    sheetGuard=false;
    try{frame.contentWindow.postMessage({type:'dojun-sheet-back'},location.origin)}catch(e){}
  });
})();
</script>
<script>
(function(){
  if(!('serviceWorker' in navigator))return;
  const RELEASE='20260922-v70-manualaudit2',KEY='dojun-sw-release';
  let reloading=false;
  function reloadOnce(){
    if(reloading||localStorage.getItem(KEY)===RELEASE)return;
    reloading=true;localStorage.setItem(KEY,RELEASE);location.reload();
  }
  navigator.serviceWorker.addEventListener('controllerchange',reloadOnce);
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?r='+RELEASE,{updateViaCache:'none'});
      await reg.update();
      if(reg.active&&String(reg.active.scriptURL||'').includes(RELEASE))reloadOnce();
    }catch(e){}
  });
})();
</script>
