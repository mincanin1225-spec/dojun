<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF8F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="도준이 밥상">
<meta name="description" content="도준이 이유식 스케줄·식단 만들기·재고·섭취 기록">
<title>도준이 밥상 v26</title>
<style>
:root{--bg:#FFF8F1;--ink:#4A4038;--muted:#9B8F85;--line:#EEE2D6;--card:#fff;--peach:#F2925C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#EEE6DD;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}body{display:flex;justify-content:center}.shell{width:100%;max-width:520px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 50px rgba(74,64,56,.08)}.head{padding:10px 12px 9px;background:rgba(255,248,241,.98);border-bottom:1px solid var(--line);z-index:3}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:17px;font-weight:900}.ver{font-size:11px;font-weight:900;color:#fff;background:var(--peach);border-radius:99px;padding:4px 9px}.desc{font-size:11px;color:var(--muted);margin-top:2px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px;padding:4px;background:#F2E8DE;border-radius:14px}.seg button{border:0;background:transparent;border-radius:11px;padding:9px 7px;font:inherit;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(74,64,56,.08)}.framewrap{flex:1;min-height:0;position:relative;background:#fff}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.hidden{display:none}.foot{padding:5px 8px calc(5px + env(safe-area-inset-bottom));font-size:10px;text-align:center;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="shell">
<header class="head">
  <div class="top"><div><div class="title">도준이 밥상</div><div class="desc">전체 스케줄 + 식단 만들기·냉동재고 통합</div></div><span class="ver">v26</span></div>
  <div class="seg" role="tablist" aria-label="화면 선택">
    <button class="on" id="tab-schedule" role="tab" aria-selected="true">전체 스케줄·기록</button>
    <button id="tab-prep" role="tab" aria-selected="false">식단 만들기·재고</button>
  </div>
</header>
<div class="framewrap">
  <iframe class="frame" id="frame-schedule" src="./legacy-v24.html?v=20260915-v26" title="전체 스케줄과 기록"></iframe>
  <iframe class="frame hidden" id="frame-prep" src="./ppeuni-v25-live.html?v=20260915-v26" title="식단 만들기와 냉동 재고"></iframe>
</div>
<div class="foot">실사용 v26 · 기존 기록과 v25 냉동재고 데이터를 그대로 이어서 사용합니다.</div>
</div>
<script>
(function(){
  const schedule=document.getElementById('frame-schedule'),prep=document.getElementById('frame-prep');
  const ts=document.getElementById('tab-schedule'),tp=document.getElementById('tab-prep');
  function show(which){
    const isSchedule=which!=='prep';
    schedule.classList.toggle('hidden',!isSchedule);prep.classList.toggle('hidden',isSchedule);
    ts.classList.toggle('on',isSchedule);tp.classList.toggle('on',!isSchedule);
    ts.setAttribute('aria-selected',String(isSchedule));tp.setAttribute('aria-selected',String(!isSchedule));
    try{history.replaceState(null,'',isSchedule?'#schedule':'#prep')}catch(e){}
  }
  ts.addEventListener('click',()=>show('schedule'));
  tp.addEventListener('click',()=>show('prep'));
  if(location.hash==='#prep')show('prep'); else show('schedule');
})();
</script>
</body>
</html>
