<title>도준이 밥상</title>
<style>html,body{margin:0;height:100%;background:#FFF8F1}#app{border:0;width:100%;height:100dvh;display:block}</style>
</head>
<body>
<iframe id="app" src="./legacy-v24.html?v=20260915-v29" title="도준이 밥상"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  function inject(){
    const d=frame.contentDocument;
    if(!d||!d.head)return;
    if(d.getElementById('v29-management-script'))return;
    const s=d.createElement('script');
    s.id='v29-management-script';
    s.src='./legacy-management-v29.js?v=20260915-v29';
    d.head.appendChild(s);
  }
  frame.addEventListener('load',inject);
  try{inject()}catch(e){}
})();
</script>
</body>
