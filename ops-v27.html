<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>도준이 밥상 v27</title><style>:root{--bg:#fff8f1;--card:#fff;--ink:#4a4038;--muted:#9b8f85;--line:#eee2d6;--peach:#f2925c;--mint:#6fbfa0;--berry:#df7892;--sky:#77a8d8}*{box-sizing:border-box}body{margin:0;background:#eee4da;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:640px;min-height:100vh;margin:auto;background:var(--bg);padding:16px 14px 90px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:21px}.ver{font-size:11px;background:var(--peach);color:#fff;border-radius:99px;padding:5px 9px;font-weight:900}.sub,.hint{font-size:12px;color:var(--muted);line-height:1.55}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.steps button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 4px;font-size:11px;font-weight:900;color:var(--muted)}.steps button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.card{background:#fff;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 7px 22px rgba(74,64,56,.06)}.card h2{font-size:16px;margin:0 0 8px}.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-weight:800;color:var(--ink)}.btn.pri{background:var(--peach);border-color:var(--peach);color:#fff}.btn.small{padding:6px 8px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:8px 0}.field label{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-bottom:3px}.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:10px}.section{border:1px solid var(--line);border-radius:15px;padding:11px;margin-top:10px}.raw{background:#fff7ee}.cube{background:#f3f8ff}.shop{background:#f8f4ff}.item{padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.pill{display:inline-block;border-radius:99px;padding:2px 7px;font-size:10px;font-weight:900;margin-left:4px}.have{background:#e4f4ec;color:#39785f}.need{background:#fdeadd;color:#9a5a28}.low{color:var(--berry);font-weight:900}.ok{color:#39785f;font-weight:900}.weekhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.day{border-top:1px solid var(--line);padding:11px 0}.day:first-child{border-top:0}.meal{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:4px 0}.meal b{font-size:11px;color:var(--muted)}.meal span{font-size:13px;font-weight:700}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.qty{width:70px!important}@media(max-width:520px){.steps{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="head"><div><h1>도준이 밥상</h1><div class="sub" id="age"></div></div><span class="ver">v27</span></div><div class="steps"><button data-view="inventory">1단계<br>재고관리</button><button data-view="shopping">2단계<br>장보기</button><button data-view="prep">3단계<br>식단만들기</button><button class="on" data-view="schedule">4단계<br>전체스케줄</button></div><section id="inventory" class="hidden"></section><section id="shopping" class="hidden"></section><section id="prep" class="hidden"></section><section id="schedule"></section></main><script src="./src/ppeuni-core.js?v=27"></script><script src="./src/ppeuni-data.js?v=27"></script><script src="./src/ops-v27.js?v=27"></script><script>(function(){'use strict';const C=window.PpeuniCore,D=window.PpeuniData,O=window.DojunOpsV27;if(!C||!D||!O)return;const K={cube:'dj:cubeInventory2',raw:'dj:rawInventory3',prepared:'dj:prepConsumed2'};const $=s=>document.querySelector(s),load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let cubes=load(K.cube,[]),raw=O.cleanRawInventory(load(K.raw,{})),prepared=load(K.prepared,{});const today=C.iso(new Date()),cycle=C.nextPrepCycle(today),months=C.ageMonths(D.child.birth,today),slot={breakfast:'아침',lunch:'점심',dinner:'저녁'},md=s=>{const d=C.parse(s);return`${d.getMonth()+1}/${d.getDate()}`},wd=s=>'일월화수목금토'[C.parse(s).getDay()],opts={allowProvisional:true};$('#age').textContent=`${today} · 생후 ${months}개월`;function show(v){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));['inventory','shopping','prep','schedule'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==v));try{history.replaceState(null,'','#'+v)}catch(e){}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));function ingredients(){const set=new Set();cycle.windows.forEach(w=>{try{C.mealsInRange(D.plan,w.start,w.count,opts).forEach(x=>x.meal.ingredients.forEach(i=>set.add(i.name)))}catch(e){}});cubes.forEach(b=>set.add(b.ingredient));Object.keys(raw).forEach(k=>set.add(k));return[...set].sort((a,b)=>a.localeCompare(b,'ko'))}function cubeText(name){const a=cubes.filter(b=>b.ingredient===name&&Number(b.remainingCount)>0);return a.length?a.map(b=>`${b.code||'코드없음'} ${b.remainingCount}개×${b.unitG}g`).join(' / '):'없음'}function renderInventory(){const names=ingredients();$('#inventory').innerHTML=`<div class="card"><h2>1단계 · 재고관리</h2><div class="hint">토요일에 실제 집 재고와 맞춰요. 생재료와 만들어둔 냉동 큐브를 여기서 한 번에 확인합니다.</div><div class="section raw"><b>생재료 재고</b>${names.map(n=>`<div class="item row"><div class="grow"><b>${esc(n)}</b><div class="hint">현재 원재료</div></div><input class="qty" data-raw="${encodeURIComponent(n)}" type="number" min="0" value="${O.rawStockFor(raw,n)}"> g</div>`).join('')}<button class="btn pri" id="saveRaw">실재고 갱신</button></div><div class="section cube"><b>냉동 큐브 재고</b>${names.map(n=>`<div class="item"><b>${esc(n)}</b><div class="hint">${esc(cubeText(n))}</div></div>`).join('')}</div></div>`;$('#saveRaw').onclick=()=>{document.querySelectorAll('[data-raw]').forEach(i=>{raw=O.setRawStock(raw,decodeURIComponent(i.dataset.raw),Number(i.value)||0)});save(K.raw,raw);renderAll();show('shopping')}}function windowCard(w){const list=O.shoppingList(D.plan,w,cubes,raw,opts);return`<div class="card"><div class="weekhead"><div><h2>${w.id==='first'?'1차 장보기':'2차 장보기'}</h2><div class="hint">${md(w.prepDate)} 준비 · ${md(w.start)}~${md(w.end)}</div></div></div>${list.length?list.map(x=>`<div class="item"><b>${esc(x.ingredient)}</b><span class="pill need">사야 함 ${Math.ceil(x.buyG)}g</span><div class="hint">만들 필요 ${Math.ceil(x.makeG)}g · 집 원재료 ${Math.ceil(x.rawG)}g · 냉동큐브 ${Math.ceil(x.stockG)}g</div></div>`).join(''):'<div class="ok">✓ 추가 장보기 없음</div>'}</div>`}function renderShopping(){$('#shopping').innerHTML=`<div class="card"><h2>2단계 · 장보기</h2><div class="hint">1단계 재고를 반영해서 부족한 원재료만 보여줘요.</div></div>${cycle.windows.map(windowCard).join('')}`}function prepCard(w){const list=O.makeList(D.plan,w,cubes,raw,opts);return`<div class="card"><h2>${w.id==='first'?'1차 식단 만들기':'2차 식단 만들기'}</h2><div class="hint">${md(w.prepDate)} · ${w.id==='first'?'월~목 4일치':'금~일 3일치'}</div>${list.length?list.map(x=>`<div class="item"><b>${esc(x.ingredient)}</b><span class="pill need">새로 만들기 ${Math.ceil(x.makeG)}g</span><div class="hint">집 원재료 ${Math.ceil(x.rawG)}g · 기존 냉동큐브 ${Math.ceil(x.stockG)}g</div>${x.canMake?'<span class="ok">원재료 충분</span>':'<span class="low">장보기 먼저 필요</span>'}</div>`).join(''):'<div class="ok">✓ 새로 만들 재료 없음 · 냉동재고로 충분</div>'}</div>`}function renderPrep(){$('#prep').innerHTML=`<div class="card"><h2>3단계 · 식단만들기</h2><div class="hint">재고와 장보기를 반영해서 이번에 새로 만들 것만 보여줘요.</div></div>${cycle.windows.map(prepCard).join('')}`}function schedCard(w){const days=O.scheduleDays(D.plan,w);return`<div class="card"><div class="weekhead"><div><h2>${w.id==='first'?'월~목 4일치':'금~일 3일치'}</h2><div class="hint">${md(w.start)}~${md(w.end)}</div></div></div>${days.map(d=>`<div class="day"><b>${md(d.date)}(${wd(d.date)})</b>${d.meals.map(x=>`<div class="meal"><b>${slot[x.slot]}</b><span>${x.meal?esc(x.meal.title):'식단 미정'}</span></div>`).join('')}</div>`).join('')}</div>`}function renderSchedule(){$('#schedule').innerHTML=`<div class="card"><h2>4단계 · 전체 스케줄</h2><div class="hint">메인 화면입니다. 여기서는 재료·재고는 빼고 도준이의 하루 3끼 식단만 봅니다.</div></div>${cycle.windows.map(schedCard).join('')}`}function renderAll(){renderInventory();renderShopping();renderPrep();renderSchedule()}renderAll();const h=location.hash.replace('#','');show(['inventory','shopping','prep','schedule'].includes(h)?h:'schedule');})();</script></body></html>
