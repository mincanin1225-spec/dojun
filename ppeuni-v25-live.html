<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도준이 밥상 v25</title><style>:root{--bg:#fff8f1;--card:#fff;--ink:#4a4038;--muted:#9b8f85;--line:#eee2d6;--peach:#f2925c;--mint:#6fbfa0;--berry:#df7892}*{box-sizing:border-box}body{margin:0;background:#eee4da;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:640px;min-height:100vh;margin:auto;background:var(--bg);padding:18px 16px 70px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:21px}.sub,.hint{font-size:12px;color:var(--muted);line-height:1.5}.badge{background:#e4f4ec;color:#39785f;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}.card{background:#fff;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 7px 22px rgba(74,64,56,.06)}.notice{background:#fdeadd;border:1px solid #f8d1b9}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0}.tabs button,.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:800;color:var(--ink)}.tabs button.on{background:var(--ink);color:#fff}.hidden{display:none}.flow{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px}.flow:first-child{border-top:0}.num{width:28px;height:28px;border-radius:50%;background:#f3ebe3;display:grid;place-items:center;font-weight:900;flex:none}.done .num{background:#e4f4ec;color:#39785f}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.btn.pri{background:var(--peach);border-color:var(--peach);color:white}.btn.small{padding:6px 8px;font-size:11px}.section{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}.make{background:#fff7ee}.freezer{background:#f3f8ff}.prep,.meal{border-top:1px solid var(--line);padding:10px 0}.prep:first-child,.meal:first-child{border-top:0}.pill{display:inline-block;border-radius:99px;padding:2px 6px;font-size:10px;font-weight:800;margin-left:4px}.have{background:#e4f4ec;color:#39785f}.need{background:#fdeadd;color:#9a5a28}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin-bottom:3px}.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:10px}.stock{width:100%;border-collapse:collapse;font-size:12px}.stock td,.stock th{padding:8px 5px;border-bottom:1px solid var(--line);text-align:left}.qty{width:58px}.ok{color:#39785f;font-weight:800}.low{color:var(--berry);font-weight:800}@media(max-width:520px){.tabs{grid-template-columns:1fr 1fr}.stock thead{display:none}.stock,.stock tbody,.stock tr,.stock td{display:block;width:100%}.stock tr{padding:8px 0;border-bottom:1px solid var(--line)}.stock td{border:0;padding:2px 0}.stock td:before{content:attr(data-l);display:inline-block;width:75px;color:var(--muted);font-size:10px}}</style></head><body><main class="app"><div class="head"><div><h1>도준이 밥상</h1><div class="sub" id="age">불러오는 중…</div></div><span class="badge" id="stage">v25</span></div><div class="card notice"><b>이번 주부터 실제 운영 시작</b><div class="hint" id="cycle"></div></div><div class="tabs"><button class="on" data-tab="flow">시작 순서</button><button data-tab="prep">식단 만들기</button><button data-tab="meal">급여 체크</button><button data-tab="stock">재고 관리표</button></div><section id="flow"></section><section id="prep" class="hidden"></section><section id="meal" class="hidden"></section><section id="stock" class="hidden"></section></main><script src="./src/ppeuni-core.js?v=20260915c"></script><script src="./src/ppeuni-data.js?v=20260915c"></script><script>(function(){'use strict';const C=window.PpeuniCore,D=window.PpeuniData;if(!C||!C.nextPrepCycle||!D){document.body.innerHTML='<main class="app"><div class="card notice"><b>최신 파일을 불러오지 못했어요.</b><div class="hint">페이지를 한 번 새로고침해 주세요.</div></div></main>';return;}const OPT={allowProvisional:true},K={b:'dj:cubeInventory2',d:'dj:mealDone2',p:'dj:prepConsumed2',f:'dj:weeklyFlow2',r:'dj:cubeInventoryRefreshedAt'};const $=s=>document.querySelector(s),load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let batches=load(K.b,[]),done=load(K.d,{}),prepared=load(K.p,{}),flows=load(K.f,{});const today=C.iso(new Date()),up=C.nextPrepCycle(today),prev=C.addDays(up.stockCheckDate,-7),cycle=(C.parse(today).getDay()!==6&&flows[prev])?C.prepCycleFromSaturday(prev):up,months=C.ageMonths(D.child.birth,today),stage=D.stages[C.ppeuniStageForAge(months)];const md=s=>{let d=C.parse(s);return`${d.getMonth()+1}/${d.getDate()}`},wd=s=>'일월화수목금토'[C.parse(s).getDay()],flow=()=>flows[cycle.id]||(flows[cycle.id]={}),setf=(k,v=true)=>{flow()[k]=v;save(K.f,flows)},pkey=w=>`${cycle.id}:${w.id}`,plist=w=>prepared[pkey(w)]?[]:C.buildPrepList(D.plan,w.start,w.count,batches,OPT),missing=w=>plist(w).filter(x=>x.missingG>1e-9),show=t=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));['flow','prep','meal','stock'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==t));};$('#age').textContent=`${today} · 생후 ${months}개월`;$('#stage').textContent=stage?stage.label:'v25';$('#cycle').innerHTML=`${md(cycle.stockCheckDate)}(${wd(cycle.stockCheckDate)}) 재고 확인 → ${md(cycle.first.prepDate)} 1차 준비 → ${md(cycle.first.start)}~${md(cycle.first.end)} 4일치 → ${md(cycle.second.prepDate)} 2차 준비 → ${md(cycle.second.start)}~${md(cycle.second.end)} 3일치`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));function renderFlow(){const f=flow(),m1=missing(cycle.first),m2=missing(cycle.second),items=[[1,cycle.stockCheckDate,'집 재고 파악','냉동실 실제 개수를 확인하고 앱 숫자를 맞춥니다.',!!f.audit,'audit'],[2,cycle.stockCheckDate,'실재고 갱신','재고표에서 재고 갱신을 누릅니다.',!!f.stockRefreshed,'stock'],[3,cycle.stockCheckDate,'장보기',m1.length?m1.map(x=>`${x.ingredient} ${Math.ceil(x.missingG)}g`).join(' · '):'현재 추가 제조 후보 없음',!!f.shopping,'shopping'],[4,cycle.first.prepDate,'1차 재료 제조·입고',m1.length?`${m1.length}종 부족`:'준비 완료',m1.length===0,'prep'],[5,cycle.first.prepDate,'월~목 4일치 만들기','완료 시 사용 큐브 재고 차감',!!prepared[pkey(cycle.first)],'prep'],[6,cycle.first.prepDate,'1차 최종 재고 확인','실제 남은 수량 확인',!!f.final1,'final1'],[7,cycle.second.prepDate,'2차 재료 제조·입고',m2.length?`${m2.length}종 부족`:'준비 완료',m2.length===0,'prep'],[8,cycle.second.prepDate,'금~일 3일치 만들기','완료 시 사용 큐브 재고 차감',!!prepared[pkey(cycle.second)],'prep'],[9,cycle.second.prepDate,'이번 주 최종 재고 확인','다음 토요일 기준 재고',!!f.final2,'final2']];$('#flow').innerHTML=`<div class="card"><b>이번 운영 순서</b>${items.map(([n,d,t,dt,ok,a])=>`<div class="flow ${ok?'done':''}"><div class="num">${ok?'✓':n}</div><div class="grow"><small class="hint">${md(d)}(${wd(d)})</small><br><b>${t}</b><div class="hint">${dt}</div>${['audit','shopping','final1','final2'].includes(a)?`<label class="row"><input type="checkbox" data-f="${a}" ${f[a]?'checked':''}> 완료</label>`:`<button class="btn small" data-go="${a}">열기</button>`}</div></div>`).join('')}</div>`;document.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{setf(x.dataset.f,x.checked);renderAll()});document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>show(x.dataset.go));}function addBatch(ing,w,code,unit,count){const same=batches.find(b=>b.code===code&&b.ingredient===ing&&b.madeDate===w.prepDate&&Number(b.unitG)===unit);if(same){same.initialCount+=count;same.remainingCount+=count;same.updatedAt=Date.now()}else batches.push(C.cleanBatch({code,ingredient:ing,madeDate:w.prepDate,unitG:unit,initialCount:count,remainingCount:count,thresholdCount:4,location:'냉동'}));save(K.b,batches);}function prepCard(w){if(prepared[pkey(w)])return`<div class="card"><b>${w.label}</b><div class="ok">✓ 만들기 완료 · 재고 차감 완료</div></div>`;const list=plist(w),mk=list.filter(x=>x.missingG>1e-9),have=list.filter(x=>x.stockG>0);return`<div class="card"><b>${w.label}</b><div class="hint">${md(w.prepDate)} 준비 · ${md(w.start)}~${md(w.end)}</div><div class="section freezer"><b>① 냉동실에서 꺼내 쓰기</b>${have.length?have.map(x=>`<div class="prep"><b>${x.ingredient}</b><span class="pill have">재고 사용</span><div class="hint">필요 ${x.needG}g · 현재 ${x.stockG}g</div></div>`).join(''):'<div class="hint">없음</div>'}</div><div class="section make"><b>② 부족 재료 만들기 → 재고 입고</b>${mk.length?mk.map(x=>{const id=encodeURIComponent(x.ingredient),meta=batches.find(b=>b.ingredient===x.ingredient),u=meta?.unitG||20,c=Math.ceil(x.missingG/u);return`<div class="prep"><b>${x.ingredient}</b><span class="pill need">부족 ${Math.ceil(x.missingG)}g</span><div class="grid"><div class="field"><label>코드</label><input id="c-${w.id}-${id}" value="${meta?.code||''}" placeholder="A-1"></div><div class="field"><label>1개 g</label><input id="u-${w.id}-${id}" type="number" value="${u}"></div><div class="field"><label>만든 개수</label><input id="n-${w.id}-${id}" type="number" value="${c}"></div></div><button class="btn pri small" data-in="${w.id}" data-i="${id}">제조 완료 · 재고 갱신</button></div>`}).join(''):'<div class="ok">새로 만들 재료 없음</div>'}</div><button class="btn pri" data-complete="${w.id}" ${mk.length?'disabled':''}>③ ${w.id==='first'?'월~목 4일치':'금~일 3일치'} 만들기 완료</button></div>`;}function renderPrep(){$('#prep').innerHTML=cycle.windows.map(prepCard).join('');document.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{const w=cycle[b.dataset.in],ing=decodeURIComponent(b.dataset.i),id=b.dataset.i,code=$(`#c-${w.id}-${id}`).value.trim(),unit=Number($(`#u-${w.id}-${id}`).value),count=Number($(`#n-${w.id}-${id}`).value);if(!code||unit<=0||count<=0)return alert('코드·중량·개수를 확인해 주세요.');addBatch(ing,w,code,unit,count);renderAll();show('prep')});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const w=cycle[b.dataset.complete],r=C.completePrepWindowOnce({batches,prepared},D.plan,w.start,w.count,pkey(w),OPT);if(r.blocked)return alert('아직 부족 재료가 있어요.');batches=r.batches;prepared=r.prepared;save(K.b,batches);save(K.p,prepared);renderAll();show('prep')});}function renderMeal(){const days=[];cycle.windows.forEach(w=>{for(let i=0;i<w.count;i++)days.push(C.addDays(w.start,i))});$('#meal').innerHTML=`<div class="card"><b>실제 급여 체크</b><div class="hint">재고는 만들기 완료 때 차감됩니다.</div>${days.map(d=>`<div style="margin-top:10px"><b>${md(d)}(${wd(d)})</b>${['breakfast','lunch','dinner'].map(s=>{const m=D.plan[d]?.[s];if(!m)return'';const k=C.planMealKey(d,s);return`<label class="meal row"><input type="checkbox" data-m="${d}|${s}" ${done[k]?'checked disabled':''}><span>${m.title}</span></label>`}).join('')}</div>`).join('')}</div>`;document.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>{const[d,s]=x.dataset.m.split('|'),r=C.markMealDoneOnce(done,d,s,D.plan[d][s],OPT);done=r.done;save(K.d,done);renderMeal()});}function renderStock(){const rows=batches.map((b,i)=>`<tr><td data-l="코드"><b>${esc(b.code)}</b></td><td data-l="재료">${esc(b.ingredient)}</td><td data-l="1개">${b.unitG}g</td><td data-l="남은 수"><input class="qty" data-q="${i}" type="number" min="0" value="${b.remainingCount}"></td><td data-l="총량">${Math.round(b.remainingCount*b.unitG)}g</td><td data-l="제조일">${b.madeDate}</td></tr>`).join('');$('#stock').innerHTML=`<div class="card"><b>우리집 냉동실 재고 관리표</b><div class="hint">토요일에 실제 냉동실 수량과 맞춘 뒤 재고 갱신을 누르세요.</div><button class="btn pri" id="refresh">재고 갱신</button><table class="stock"><thead><tr><th>코드</th><th>재료</th><th>1개</th><th>남은 수</th><th>총량</th><th>제조일</th></tr></thead><tbody>${rows||'<tr><td>등록 재고 없음</td></tr>'}</tbody></table></div><div class="card"><b>새 재고 등록</b><div class="grid"><div class="field"><label>코드</label><input id="ac"></div><div class="field"><label>재료</label><input id="ai"></div><div class="field"><label>1개 g</label><input id="au" type="number" value="20"></div><div class="field"><label>개수</label><input id="an" type="number"></div></div><button class="btn pri" id="add">추가</button></div>`;$('#refresh').onclick=()=>{document.querySelectorAll('[data-q]').forEach(x=>{const b=batches[Number(x.dataset.q)],v=Number(x.value);if(v>=0){if(v>b.initialCount)b.initialCount=v;b.remainingCount=v;b.updatedAt=Date.now()}});save(K.b,batches);const now=new Date().toISOString();localStorage.setItem(K.r,now);setf('stockRefreshed',now);renderAll();show('flow')};$('#add').onclick=()=>{try{const code=$('#ac').value.trim(),ing=$('#ai').value.trim(),unit=Number($('#au').value),n=Number($('#an').value);batches.push(C.cleanBatch({code,ingredient:ing,madeDate:today,unitG:unit,initialCount:n,remainingCount:n,thresholdCount:4,location:'냉동'}));save(K.b,batches);renderAll();show('stock')}catch(e){alert('입력값을 확인해 주세요.')}};}function renderAll(){renderFlow();renderPrep();renderMeal();renderStock()}renderAll();})();</script></body></html>
