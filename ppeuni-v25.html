<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도준이 밥상 · v25</title>
<style>
:root{--bg:#fff8f1;--card:#fff;--ink:#4a4038;--muted:#9b8f85;--line:#eee2d6;--mint:#6fbfa0;--peach:#f2925c;--berry:#df7892;--sky:#77a8d8;--r:20px}*{box-sizing:border-box}body{margin:0;background:#eee4da;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding:18px 16px 80px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.head h1{font-size:21px;margin:0}.sub,.hint{color:var(--muted);font-size:12.5px;line-height:1.55}.badge{padding:6px 10px;border-radius:99px;background:#e4f4ec;color:#39785f;font-size:12px;font-weight:800}.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(74,64,56,.06)}h2{font-size:16px;margin:0 0 10px}.notice{background:#fdeadd;border:1px solid #f8d1b9}.notice b{color:#9a5a28}.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;color:var(--ink);font-weight:700}.btn.pri{background:var(--peach);border-color:var(--peach);color:#fff}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:9px 0}.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 10px;color:var(--ink)}.prep,.stock,.meal{border-top:1px solid var(--line);padding:12px 0}.prep:first-child,.stock:first-child,.meal:first-child{border-top:0}.check{width:22px;height:22px}.low{color:var(--berry);font-weight:800}.ok{color:#39785f;font-weight:800}.source{font-size:11px;color:var(--sky);font-weight:700}.temp{font-size:11px;color:#a66b2f;font-weight:800}.empty{text-align:center;padding:18px 4px;color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 4px;font-size:12px;font-weight:800}.tabs button.on{background:var(--ink);color:white;border-color:var(--ink)}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.summary div{background:#faf5ee;border-radius:12px;padding:9px;text-align:center;font-size:11px}.summary b{display:block;font-size:15px}.catalog{font-size:12px;line-height:1.8;color:#746a62}.foot{margin-top:20px;font-size:11px;color:var(--muted)}
</style>
</head>
<body><main class="app">
<header class="head"><div><h1>도준이 밥상</h1><div class="sub" id="age"></div></div><span class="badge" id="stage"></span></header>
<div class="card notice"><b>현재는 개발용 임시 식단으로 운영 중</b><div class="hint" style="margin-top:5px">앱 구조를 먼저 완성하기 위한 가안입니다. 『뿐이 토핑 이유식』 실제 스케줄표를 받으면 식단 데이터만 교체하고 준비·체크·재고 기능은 그대로 유지합니다.</div></div>
<div class="tabs"><button class="on" data-tab="prep">이번 주 준비</button><button data-tab="meal">식단 체크</button><button data-tab="stock">큐브 재고</button></div>
<section id="view-prep"></section><section id="view-meal" class="hidden"></section><section id="view-stock" class="hidden"></section>
<div class="card"><h2>식단 출처 상태</h2><div id="sourceStatus"></div><details style="margin-top:10px"><summary class="hint">현재 월령의 『뿐이』 공개 목차 확인 항목</summary><div class="catalog" id="catalog"></div></details></div>
<p class="foot">v25 개발 화면 · 기존 v24 저장 데이터와 분리되어 있습니다.</p>
</main>
<script src="./src/ppeuni-core.js"></script><script src="./src/ppeuni-data.js"></script>
<script>
(function(){
'use strict';
const C=window.PpeuniCore,D=window.PpeuniData,OPTS={allowProvisional:true};
const KEY={batches:'dj:cubeInventory2',prep:'dj:prepCheck2',done:'dj:mealDone2'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch(e){return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let batches=load(KEY.batches,[]),prepCheck=load(KEY.prep,{}),done=load(KEY.done,{});
const today=C.iso(new Date()),months=C.ageMonths(D.child.birth,today),stageKey=C.ppeuniStageForAge(months),stage=D.stages[stageKey];
$('#age').textContent=`${today} · 생후 ${months}개월 · ${D.child.birth}생`;$('#stage').textContent=stage?stage.label:stageKey;$('#catalog').textContent=stage?stage.verifiedCatalog.join(' · '):'공개 목차 데이터 없음';
function getMeals(start,count){try{return C.mealsInRange(D.plan,start,count,OPTS)}catch(e){return []}}
function prepCard(w){const meals=getMeals(w.start,w.count),list=meals.length?C.buildPrepList(D.plan,w.start,w.count,batches,OPTS):[],key=`${w.id}|${w.prepDate}`,checked=prepCheck[key]||{};
  const rows=list.length?list.map(x=>{const on=!!checked[x.ingredient];return `<div class="prep row"><input class="check" type="checkbox" data-prep="${esc(key)}" data-item="${esc(x.ingredient)}" ${on?'checked':''}><div class="grow"><b>${esc(x.ingredient)}</b><div class="hint">필요 ${x.needG}g · 현재 큐브 ${x.stockG}g${x.missingG?` · <span class="low">부족 ${x.missingG}g</span>`:' · 재고로 충당 가능'}</div></div>${x.remake.needsRemake?'<span class="low">재제조</span>':'<span class="ok">충분</span>'}</div>`}).join(''):'<div class="empty">이 기간에 등록된 식단이 없습니다.</div>';
  return `<div class="card"><h2>${esc(w.label)}</h2><div class="hint">준비 ${w.prepDate} · 급여 ${w.start} ~ ${w.end}</div><div class="summary"><div><b>${w.count}일</b>급여</div><div><b>${meals.length}</b>끼니</div><div><b>${list.length}</b>준비 재료</div></div>${rows}</div>`}
function renderPrep(){const wins=C.prepWindowsForWeek(today);$('#view-prep').innerHTML=wins.map(prepCard).join('')}
function renderMeal(){const wins=C.prepWindowsForWeek(today),seen=new Set(),days=[];for(const w of wins)for(let i=0;i<w.count;i++){const date=C.addDays(w.start,i);if(seen.has(date))continue;seen.add(date);days.push({date,day:D.plan[date]||{}})}const names={breakfast:'아침',lunch:'점심',dinner:'저녁'};
  $('#view-meal').innerHTML=`<div class="card"><h2>이번 주 식단 완료 체크</h2><div class="hint">완료 체크 시 등록된 큐브 재고를 한 번만 차감합니다.</div>${days.map(({date,day})=>`<div style="margin-top:14px"><b>${date}</b>${['breakfast','lunch','dinner'].map(slot=>{const m=day[slot],key=C.planMealKey(date,slot);if(!m)return `<div class="meal"><div class="grow"><b>${names[slot]}</b><div class="hint">식단 없음</div></div></div>`;const isDone=!!done[key],tag=m.source==='ppeuni_verified'?'<div class="source">뿐이 원문 확인됨</div>':'<div class="temp">개발용 임시 식단</div>';return `<div class="meal row"><input class="check" type="checkbox" data-meal="${date}|${slot}" ${isDone?'checked disabled':''}><div class="grow"><b>${names[slot]} · ${esc(m.title)}</b>${tag}<div class="hint">${m.ingredients.map(x=>`${esc(x.name)} ${x.grams}g`).join(' · ')}</div></div></div>`}).join('')}</div>`).join('')}</div>`}
function stockRows(){if(!batches.length)return '<div class="empty">등록한 큐브 재고가 없습니다.</div>';return batches.map((b,i)=>{const low=b.remainingCount<=b.thresholdCount;return `<div class="stock row"><div class="grow"><b>${esc(b.code||'코드없음')} · ${esc(b.ingredient)}</b><div class="hint">${b.madeDate} 제조 · ${b.unitG}g × ${b.initialCount}개 · <b>잔여 ${b.remainingCount}개</b> · ${esc(b.location)}</div>${low?'<div class="low">재고 적음 · 다음 준비 때 재제조 확인</div>':''}</div><button class="btn small" data-use="${i}">1개 사용</button><button class="btn small" data-del="${i}">삭제</button></div>`}).join('')}
function renderStock(){$('#view-stock').innerHTML=`<div class="card"><h2>원물·토핑 큐브 제조 배치</h2>${stockRows()}</div><div class="card"><h2>새 제조 배치 추가</h2><div class="grid"><div class="field"><label>코드</label><input id="f-code" placeholder="A-1"></div><div class="field"><label>재료명</label><input id="f-ing" placeholder="양파"></div><div class="field"><label>제조일</label><input id="f-date" type="date" value="${today}"></div><div class="field"><label>1개 중량(g)</label><input id="f-unit" type="number" min="0.1" step="0.1" placeholder="20"></div><div class="field"><label>만든 개수</label><input id="f-count" type="number" min="1" step="1" placeholder="20"></div><div class="field"><label>재제조 임계(개)</label><input id="f-th" type="number" min="0" step="1" value="4"></div></div><div class="field"><label>보관 위치</label><select id="f-loc"><option>냉동</option><option>냉장</option><option>실온</option></select></div><button class="btn pri" id="addBatch">재고 추가</button></div>`;
  $('#addBatch').onclick=()=>{try{const b=C.cleanBatch({code:$('#f-code').value,ingredient:$('#f-ing').value,madeDate:$('#f-date').value,unitG:$('#f-unit').value,initialCount:$('#f-count').value,thresholdCount:$('#f-th').value,location:$('#f-loc').value});batches.push(b);save(KEY.batches,batches);renderAll()}catch(e){alert('재료명·제조일·중량·개수를 확인해 주세요.')}};
  document.querySelectorAll('[data-use]').forEach(el=>el.onclick=()=>{const b=batches[+el.dataset.use];if(!b||b.remainingCount<=0)return;b.remainingCount--;b.updatedAt=Date.now();b.history=b.history||[];b.history.push({type:'manual_use',at:new Date().toISOString(),units:1,grams:b.unitG});save(KEY.batches,batches);renderAll()});document.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{if(confirm('이 제조 배치를 삭제할까요?')){batches.splice(+el.dataset.del,1);save(KEY.batches,batches);renderAll()}})}
function renderSource(){const meals=Object.values(D.plan||{}).reduce((n,d)=>n+['breakfast','lunch','dinner'].filter(k=>d[k]).length,0);$('#sourceStatus').innerHTML=`<div class="low">현재 식단: 개발용 임시 가안 ${meals}끼 등록</div><div class="hint">뿐이 원문 식단표가 확보되면 임시 식단을 교체합니다. 임시 식단을 뿐이 식단으로 표시하지 않습니다.</div>`}
function bindChecks(){document.querySelectorAll('[data-prep]').forEach(el=>el.onchange=()=>{const k=el.dataset.prep,item=el.dataset.item;prepCheck[k]=prepCheck[k]||{};prepCheck[k][item]=el.checked;save(KEY.prep,prepCheck)});document.querySelectorAll('[data-meal]').forEach(el=>el.onchange=()=>{if(!el.checked)return;const[date,slot]=el.dataset.meal.split('|'),meal=D.plan[date]?.[slot];if(!meal)return;const r=C.completeMealOnce({batches,done},date,slot,meal,OPTS);batches=r.batches;done=r.done;save(KEY.batches,batches);save(KEY.done,done);renderAll()})}
function renderAll(){renderPrep();renderMeal();renderStock();renderSource();bindChecks()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));['prep','meal','stock'].forEach(t=>$('#view-'+t).classList.toggle('hidden',t!==b.dataset.tab))});renderAll();
})();
</script>
</body></html>
