<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도준이 밥상 · v25</title>
<style>
:root{--bg:#fff8f1;--card:#fff;--ink:#4a4038;--muted:#9b8f85;--line:#eee2d6;--mint:#6fbfa0;--peach:#f2925c;--berry:#df7892;--sky:#77a8d8;--r:20px}*{box-sizing:border-box}body{margin:0;background:#eee4da;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select{font:inherit}.app{max-width:640px;min-height:100vh;margin:auto;background:var(--bg);padding:18px 16px 80px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h1{font-size:21px;margin:0}.sub,.hint{color:var(--muted);font-size:12.5px;line-height:1.55}.badge{padding:6px 10px;border-radius:99px;background:#e4f4ec;color:#39785f;font-size:12px;font-weight:800}.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(74,64,56,.06)}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 8px}.notice{background:#fdeadd;border:1px solid #f8d1b9}.notice b{color:#9a5a28}.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;color:var(--ink);font-weight:700}.btn.pri{background:var(--peach);border-color:var(--peach);color:#fff}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:8px 0}.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 10px;color:var(--ink)}.check{width:22px;height:22px}.low{color:var(--berry);font-weight:800}.ok{color:#39785f;font-weight:800}.temp{font-size:11px;color:#a66b2f;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0}.tabs button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 3px;font-size:11px;font-weight:800}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.summary div{background:#faf5ee;border-radius:12px;padding:9px;text-align:center;font-size:11px}.summary b{display:block;font-size:15px}.sectionbox{border:1px solid var(--line);border-radius:15px;padding:10px 12px;margin-top:10px}.sectionbox.freezer{background:#f3f8ff}.sectionbox.make{background:#fff7ee}.sectionbox.shop{background:#f8f4ff}.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;margin-left:4px}.pill.have{background:#e4f4ec;color:#39785f}.pill.make{background:#fdeadd;color:#9a5a28}.pill.done{background:#e7f2ff;color:#4775a3}.prep,.meal,.flowrow{border-top:1px solid var(--line);padding:11px 0}.prep:first-child,.meal:first-child,.flowrow:first-child{border-top:0}.flowrow{display:flex;gap:10px;align-items:flex-start}.flowrow .num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#f3ebe3;font-weight:900;font-size:12px;flex:none}.flowrow.done .num{background:#e4f4ec;color:#39785f}.flowrow .date{font-size:10px;color:var(--muted);font-weight:800}.empty{text-align:center;padding:14px 4px;color:var(--muted);font-size:13px}.makeform{display:grid;grid-template-columns:1fr .8fr .8fr;gap:6px;margin-top:8px}.makeform input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 8px}.stocktable{width:100%;border-collapse:collapse;font-size:12px}.stocktable th,.stocktable td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.stocktable th{font-size:10.5px;color:var(--muted)}.qtyinput{width:58px!important;padding:6px!important;text-align:center}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.code{font-weight:900;color:#6b5e53}.foot{margin-top:20px;font-size:11px;color:var(--muted)}@media(max-width:520px){.tabs{grid-template-columns:1fr 1fr}.stocktable thead{display:none}.stocktable,.stocktable tbody,.stocktable tr,.stocktable td{display:block;width:100%}.stocktable tr{border-bottom:1px solid var(--line);padding:9px 0}.stocktable td{border:0;padding:3px 0}.stocktable td:before{content:attr(data-label);display:inline-block;width:78px;color:var(--muted);font-size:10px;font-weight:800}.stocktable td.actions:before{display:none}.grid{grid-template-columns:1fr 1fr}.makeform{grid-template-columns:1fr 1fr}.makeform .count{grid-column:1/3}}
</style>
</head>
<body><main class="app">
<header class="head"><div><h1>도준이 밥상</h1><div class="sub" id="age"></div></div><span class="badge" id="stage"></span></header>
<div class="card notice"><b>이번 주부터 실제 운영 시작</b><div class="hint" id="cycleText" style="margin-top:5px"></div></div>
<div class="tabs"><button class="on" data-tab="flow">시작 순서</button><button data-tab="prep">식단 만들기</button><button data-tab="meal">급여 체크</button><button data-tab="stock">재고 관리표</button></div>
<section id="view-flow"></section><section id="view-prep" class="hidden"></section><section id="view-meal" class="hidden"></section><section id="view-stock" class="hidden"></section>
<p class="foot">현재 식단은 개발용 임시 가안입니다. 재고·준비 운영 구조를 먼저 실사용하고, 실제 식단 기준이 확정되면 식단 데이터만 교체합니다.</p>
</main>
<script src="./src/ppeuni-core.js"></script><script src="./src/ppeuni-data.js"></script>
<script>
(function(){
'use strict';
const C=window.PpeuniCore,D=window.PpeuniData,OPTS={allowProvisional:true};
const KEY={batches:'dj:cubeInventory2',done:'dj:mealDone2',prepared:'dj:prepConsumed2',flow:'dj:weeklyFlow2',refreshed:'dj:cubeInventoryRefreshedAt'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch(e){return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let batches=load(KEY.batches,[]),done=load(KEY.done,{}),prepared=load(KEY.prepared,{}),flows=load(KEY.flow,{}),active='flow';
const today=C.iso(new Date()),upcoming=C.nextPrepCycle(today),prevSat=C.addDays(upcoming.stockCheckDate,-7),usePrev=C.parse(today).getDay()!==6&&!!flows[prevSat],cycle=usePrev?C.prepCycleFromSaturday(prevSat):upcoming;
const months=C.ageMonths(D.child.birth,today),stageKey=C.ppeuniStageForAge(months),stage=D.stages[stageKey];
const md=s=>{const d=C.parse(s);return `${d.getMonth()+1}/${d.getDate()}`},wd=s=>'일월화수목금토'[C.parse(s).getDay()];
const cycleFlow=()=>flows[cycle.id]||(flows[cycle.id]={});
function setFlow(k,v=true){cycleFlow()[k]=v;save(KEY.flow,flows)}
$('#age').textContent=`${today} · 생후 ${months}개월 · ${D.child.birth}생`;$('#stage').textContent=stage?stage.label:stageKey;
$('#cycleText').innerHTML=`<b>${md(cycle.stockCheckDate)}(${wd(cycle.stockCheckDate)}) 재고 파악</b> → <b>${md(cycle.first.prepDate)}(${wd(cycle.first.prepDate)}) 1차 준비</b> → ${md(cycle.first.start)}~${md(cycle.first.end)} 4일치 → <b>${md(cycle.second.prepDate)}(${wd(cycle.second.prepDate)}) 2차 준비</b> → ${md(cycle.second.start)}~${md(cycle.second.end)} 3일치`;
function showTab(t){active=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));['flow','prep','meal','stock'].forEach(x=>$('#view-'+x).classList.toggle('hidden',x!==t));}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function getMeals(w){try{return C.mealsInRange(D.plan,w.start,w.count,OPTS)}catch(e){return []}}
function prepKey(w){return `${cycle.id}:${w.id}`}
function prepList(w){if(prepared[prepKey(w)])return[];try{return C.buildPrepList(D.plan,w.start,w.count,batches,OPTS)}catch(e){return[]}}
function latestBatch(ing){return batches.filter(b=>b.ingredient===ing).sort((a,b)=>String(b.madeDate).localeCompare(String(a.madeDate)))[0]||null}
function freezerLabel(ing){const arr=batches.filter(b=>b.ingredient===ing&&Number(b.remainingCount)>0).sort((a,b)=>String(a.madeDate).localeCompare(String(b.madeDate)));return arr.length?arr.map(b=>`${b.code||'코드없음'} ${b.remainingCount}개×${b.unitG}g`).join(' / '):'재고 없음'}
function missingFor(w){return prepList(w).filter(x=>x.missingG>1e-9)}
function flowCheck(key,label){return `<label class="row" style="justify-content:flex-end"><input class="check" type="checkbox" data-flow="${key}" ${cycleFlow()[key]?'checked':''}><span class="hint">${label}</span></label>`}
function flowRow(n,date,title,detail,doneState,action=''){return `<div class="flowrow ${doneState?'done':''}"><div class="num">${doneState?'✓':n}</div><div class="grow"><div class="date">${md(date)}(${wd(date)})</div><b>${title}</b><div class="hint">${detail}</div>${action}</div></div>`}
function renderFlow(){
  const f=cycleFlow(),m1=missingFor(cycle.first),m2=missingFor(cycle.second),ref=!!f.stockRefreshed,p1=!!prepared[prepKey(cycle.first)],p2=!!prepared[prepKey(cycle.second)];
  const shop=m1.length?m1.map(x=>`${x.ingredient} ${Math.ceil(x.missingG)}g`).join(' · '):'냉동 재고 기준 추가 제조 후보 없음';
  $('#view-flow').innerHTML=`<div class="card"><h2>이번 운영 순서</h2><div class="hint">토요일에 먼저 실제 재고를 맞춰야 일요일 제조량과 장보기 후보가 정확해져요. 생재료가 이미 집에 있다면 장보지 않고 제조만 하면 됩니다.</div>
  ${flowRow(1,cycle.stockCheckDate,'집 재고 파악','냉동실·냉장고를 보면서 앱의 남은 개수와 실제 개수를 맞춥니다.',!!f.audit,flowCheck('audit','재고 확인 완료'))}
  ${flowRow(2,cycle.stockCheckDate,'실재고 갱신','재고표의 숫자를 저장하면 1차 준비 부족분이 즉시 다시 계산됩니다.',ref,`<button class="btn small" data-go="stock" style="margin-top:7px">재고 관리표 열기</button>`)}
  ${flowRow(3,cycle.stockCheckDate,'장보기','재고 갱신 뒤 부족한 제조 재료를 확인하고 일요일 전에 장봅니다.<br><b>재료준비/장보기 후보:</b> ${esc(shop)}`,!!f.shopping,flowCheck('shopping','장보기 완료'))}
  ${flowRow(4,cycle.first.prepDate,'1차 재료 만들기 → 재고 입고',m1.length?`아직 새로 만들 재료 ${m1.length}종이 있습니다.`:'필요한 냉동 재료가 모두 준비되었습니다.',m1.length===0,`<button class="btn small" data-go="prep" style="margin-top:7px">1차 만들기 열기</button>`)}
  ${flowRow(5,cycle.first.prepDate,'월~목 4일치 만들기','4일치 조립/조리를 완료하면 사용한 냉동 재고를 한 번에 차감합니다.',p1,`<button class="btn small" data-go="prep" style="margin-top:7px">1차 완료하기</button>`)}
  ${flowRow(6,cycle.first.prepDate,'1차 최종 재고 확인','4일치 제조 후 남은 재고를 눈으로 확인합니다.',!!f.final1,flowCheck('final1','최종 재고 확인 완료'))}
  ${flowRow(7,cycle.second.prepDate,'2차 부족분 확인·재료 만들기',m2.length?`현재 기준 새로 만들 재료 ${m2.length}종.`:'2차 재료도 현재 재고로 준비되었습니다.',m2.length===0,`<button class="btn small" data-go="prep" style="margin-top:7px">2차 만들기 열기</button>`)}
  ${flowRow(8,cycle.second.prepDate,'금~일 3일치 만들기','3일치 준비 완료 시 사용 재고를 한 번에 차감합니다.',p2,`<button class="btn small" data-go="prep" style="margin-top:7px">2차 완료하기</button>`)}
  ${flowRow(9,cycle.second.prepDate,'이번 주 최종 재고 확인','다음 토요일 재고 파악 전까지 이 수량이 앱 기준 재고가 됩니다.',!!f.final2,flowCheck('final2','최종 재고 확인 완료'))}</div>`;
  document.querySelectorAll('[data-flow]').forEach(el=>el.onchange=()=>{setFlow(el.dataset.flow,el.checked);renderFlow()});
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>showTab(el.dataset.go));
}
function makeRow(w,x){const meta=latestBatch(x.ingredient),unit=meta?.unitG||'',code=meta?.code||'',cnt=unit?Math.ceil(x.missingG/unit):'',tok=encodeURIComponent(x.ingredient);return `<div class="prep"><div><b>${esc(x.ingredient)}</b><span class="pill make">새로 만들기</span><div class="hint">필요 ${x.needG}g · 기존 ${Math.min(x.stockG,x.needG)}g · <b>부족 ${Math.ceil(x.missingG)}g</b></div></div><div class="makeform"><input id="code-${w.id}-${tok}" placeholder="코드 예:A-1" value="${esc(code)}"><input id="unit-${w.id}-${tok}" type="number" min="0.1" step="0.1" placeholder="1개 g" value="${unit}"><input class="count" id="count-${w.id}-${tok}" type="number" min="1" step="1" placeholder="만든 개수" value="${cnt}"></div><button class="btn pri small" data-stockin="${w.id}" data-ing="${tok}" style="margin-top:7px">제조 완료 · 재고 갱신</button></div>`}
function prepCard(w){const key=prepKey(w),isDone=!!prepared[key],meals=getMeals(w);if(isDone)return `<div class="card"><h2>${esc(w.label)}</h2><div class="hint">준비 ${md(w.prepDate)} · 급여 ${md(w.start)}~${md(w.end)}</div><div class="sectionbox freezer"><b class="ok">✓ 이 배치는 만들기 완료</b><div class="hint">식단 ${meals.length}끼에 사용한 냉동 재고가 이미 차감됐습니다. 재고 관리표에서 최종 수량을 확인해 주세요.</div></div></div>`;
  const list=prepList(w),use=list.filter(x=>x.stockG>0),make=list.filter(x=>x.missingG>1e-9);
  const freezer=use.length?use.map(x=>`<div class="prep"><b>${esc(x.ingredient)}</b><span class="pill have">꺼내 쓰기</span><div class="hint">${esc(freezerLabel(x.ingredient))}</div><div class="hint">필요 ${x.needG}g 중 기존 재고 ${Math.min(x.stockG,x.needG)}g 사용</div></div>`).join(''):'<div class="empty">꺼내 쓸 냉동 재고 없음</div>';
  const maker=make.length?make.map(x=>makeRow(w,x)).join(''):'<div class="empty"><b class="ok">새로 만들 재료 없음</b><br>현재 냉동 재고로 이번 배치를 준비할 수 있어요.</div>';
  return `<div class="card"><h2>${esc(w.label)}</h2><div class="hint">준비 ${md(w.prepDate)}(${wd(w.prepDate)}) · 급여 ${md(w.start)}~${md(w.end)} · ${meals.length}끼</div><div class="summary"><div><b>${use.length}</b>재고 사용</div><div><b>${make.length}</b>새 제조</div><div><b>${w.count}일</b>식단</div></div><div class="sectionbox freezer"><h3>① 냉동실에서 꺼내 쓰기</h3>${freezer}</div><div class="sectionbox make"><h3>② 부족한 재료 새로 만들기 → 재고 갱신</h3>${maker}</div><button class="btn pri" data-completeprep="${w.id}" ${make.length?'disabled':''} style="width:100%;margin-top:12px">③ ${w.id==='first'?'월~목 4일치':'금~일 3일치'} 만들기 완료 · 사용재고 차감</button><div class="hint" style="margin-top:6px">부족한 재료를 모두 재고에 입고해야 완료 버튼이 활성화됩니다.</div></div>`}
function renderPrep(){ $('#view-prep').innerHTML=cycle.windows.map(prepCard).join('');
  document.querySelectorAll('[data-stockin]').forEach(el=>el.onclick=()=>{const w=cycle[el.dataset.stockin],ing=decodeURIComponent(el.dataset.ing),tok=el.dataset.ing,code=document.getElementById(`code-${w.id}-${tok}`).value.trim(),unit=Number(document.getElementById(`unit-${w.id}-${tok}`).value),count=Number(document.getElementById(`count-${w.id}-${tok}`).value);if(!code||!Number.isFinite(unit)||unit<=0||!Number.isInteger(count)||count<=0)return alert('코드, 1개 중량, 만든 개수를 확인해 주세요.');const conflict=batches.find(b=>b.code===code&&b.ingredient!==ing);if(conflict)return alert(`${code}는 이미 ${conflict.ingredient} 코드로 사용 중이에요.`);const same=batches.find(b=>b.code===code&&b.ingredient===ing&&b.madeDate===w.prepDate&&Number(b.unitG)===unit);if(same){same.initialCount+=count;same.remainingCount+=count;same.updatedAt=Date.now();same.history=same.history||[];same.history.push({type:'stock_in',at:new Date().toISOString(),units:count,grams:count*unit,ref:`prep:${cycle.id}:${w.id}`})}else{batches.push(C.cleanBatch({code,ingredient:ing,madeDate:w.prepDate,unitG:unit,initialCount:count,remainingCount:count,thresholdCount:4,location:'냉동',history:[{type:'stock_in',at:new Date().toISOString(),units:count,grams:count*unit,ref:`prep:${cycle.id}:${w.id}`}] }))}save(KEY.batches,batches);renderAll();showTab('prep')});
  document.querySelectorAll('[data-completeprep]').forEach(el=>el.onclick=()=>{const w=cycle[el.dataset.completeprep],key=prepKey(w),r=C.completePrepWindowOnce({batches,prepared},D.plan,w.start,w.count,key,OPTS);if(r.blocked)return alert('아직 부족한 재료가 있어요. 위에서 제조 완료·재고 갱신을 먼저 해 주세요.');batches=r.batches;prepared=r.prepared;save(KEY.batches,batches);save(KEY.prepared,prepared);renderAll();showTab('prep')});
}
function renderMeal(){const days=[];for(const w of cycle.windows)for(let i=0;i<w.count;i++){const date=C.addDays(w.start,i),day=D.plan[date]||{};days.push({date,day})}const nm={breakfast:'아침',lunch:'점심',dinner:'저녁'};$('#view-meal').innerHTML=`<div class="card"><h2>실제 급여 체크</h2><div class="hint">재고는 일/목 만들기 완료 때 이미 차감합니다. 여기 체크는 실제로 먹인 기록만 남겨요.</div>${days.map(({date,day})=>`<div style="margin-top:14px"><b>${md(date)}(${wd(date)})</b>${['breakfast','lunch','dinner'].map(slot=>{const m=day[slot],key=C.planMealKey(date,slot);if(!m)return'';return `<div class="meal row"><input class="check" type="checkbox" data-meal="${date}|${slot}" ${done[key]?'checked disabled':''}><div class="grow"><b>${nm[slot]} · ${esc(m.title)}</b><div class="temp">개발용 임시 식단</div><div class="hint">${m.ingredients.map(x=>`${esc(x.name)} ${x.grams}g`).join(' · ')}</div></div></div>`}).join('')}</div>`).join('')}</div>`;document.querySelectorAll('[data-meal]').forEach(el=>el.onchange=()=>{if(!el.checked)return;const[date,slot]=el.dataset.meal.split('|'),m=D.plan[date]?.[slot];const r=C.markMealDoneOnce(done,date,slot,m,OPTS);done=r.done;save(KEY.done,done);renderMeal()})}
function stockRows(){if(!batches.length)return '<tr><td colspan="8"><div class="empty">등록 재고 없음. 토요일에 집 재고를 확인하며 아래에서 추가해 주세요.</div></td></tr>';return batches.map((b,i)=>({b,i})).sort((x,y)=>String(x.b.code).localeCompare(String(y.b.code),'ko')||String(x.b.madeDate).localeCompare(String(y.b.madeDate))).map(({b,i})=>{const total=Math.round(Number(b.remainingCount)*Number(b.unitG)*100)/100,low=Number(b.remainingCount)<=Number(b.thresholdCount);return `<tr><td data-label="코드"><strong class="code">${esc(b.code||'—')}</strong></td><td data-label="재료"><b>${esc(b.ingredient)}</b></td><td data-label="1개">${b.unitG}g</td><td data-label="남은 수"><input class="qtyinput" data-qty="${i}" type="number" min="0" step="1" value="${b.remainingCount}">개</td><td data-label="총량">${total}g</td><td data-label="제조일">${esc(b.madeDate)}</td><td data-label="상태">${low?'<span class="low">재제조 필요</span>':'<span class="ok">충분</span>'}</td><td class="actions"><button class="btn small" data-del="${i}">삭제</button></td></tr>`}).join('')}
function inventorySnapshot(){return batches.length?'도준이 냉동실 재고\n'+batches.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),'ko')).map(b=>`${b.code||'코드없음'}(${b.ingredient}) = ${b.remainingCount}개 × ${b.unitG}g / 제조 ${b.madeDate}`).join('\n'):'도준이 냉동실 재고: 없음'}
function renderStock(){const last=localStorage.getItem(KEY.refreshed);$('#view-stock').innerHTML=`<div class="card"><h2>우리집 냉동실 재고 관리표</h2><div class="hint"><b>토요일 순서:</b> 냉동실을 보면서 남은 수를 고침 → <b>재고 갱신</b> → 식단 만들기에서 부족분/장보기 후보 확인.</div><div class="toolbar"><button class="btn pri" id="refreshStock">재고 갱신</button><button class="btn" id="copyStock">목록 복사</button>${last?`<span class="hint">마지막 갱신 ${new Date(last).toLocaleString('ko-KR')}</span>`:''}</div><div style="overflow-x:auto"><table class="stocktable"><thead><tr><th>코드</th><th>재료</th><th>1개</th><th>남은 수</th><th>총량</th><th>제조일</th><th>상태</th><th></th></tr></thead><tbody>${stockRows()}</tbody></table></div></div><div class="card"><h2>새 재고 등록</h2><div class="grid"><div class="field"><label>코드</label><input id="f-code" placeholder="A-1"></div><div class="field"><label>재료명</label><input id="f-ing" placeholder="당근"></div><div class="field"><label>제조일</label><input id="f-date" type="date" value="${today}"></div><div class="field"><label>1개 중량(g)</label><input id="f-unit" type="number" min="0.1" step="0.1"></div><div class="field"><label>현재 개수</label><input id="f-count" type="number" min="0" step="1"></div><div class="field"><label>재제조 임계(개)</label><input id="f-th" type="number" min="0" step="1" value="4"></div></div><button class="btn pri" id="addBatch">재고 추가</button></div>`;
  $('#refreshStock').onclick=()=>{for(const inp of document.querySelectorAll('[data-qty]')){const i=Number(inp.dataset.qty),v=Number(inp.value);if(!Number.isFinite(v)||v<0)return alert('남은 개수는 0 이상으로 입력해 주세요.');const b=batches[i];if(v>b.initialCount)b.initialCount=v;b.remainingCount=v;b.updatedAt=Date.now();b.history=b.history||[];b.history.push({type:'actual_inventory_refresh',at:new Date().toISOString(),remainingCount:v})}save(KEY.batches,batches);const now=new Date().toISOString();localStorage.setItem(KEY.refreshed,now);setFlow('stockRefreshed',now);renderAll();showTab('flow')};
  $('#addBatch').onclick=()=>{try{const code=$('#f-code').value.trim(),ing=$('#f-ing').value.trim(),unit=Number($('#f-unit').value),count=Number($('#f-count').value),date=$('#f-date').value,th=Number($('#f-th').value);if(batches.some(b=>b.code===code&&b.ingredient!==ing))return alert('같은 코드는 다른 재료에 사용할 수 없어요.');batches.push(C.cleanBatch({code,ingredient:ing,madeDate:date,unitG:unit,initialCount:count,remainingCount:count,thresholdCount:th,location:'냉동'}));save(KEY.batches,batches);renderAll();showTab('stock')}catch(e){alert('코드·재료·제조일·중량·개수를 확인해 주세요.')}};
  document.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{if(confirm('이 재고 배치를 삭제할까요?')){batches.splice(Number(el.dataset.del),1);save(KEY.batches,batches);renderAll();showTab('stock')}});
  $('#copyStock').onclick=async()=>{const t=inventorySnapshot();try{await navigator.clipboard.writeText(t);alert('재고표를 복사했어요.')}catch(e){prompt('복사해 주세요.',t)}}
}
function renderAll(){renderFlow();renderPrep();renderMeal();renderStock()}
renderAll();
})();
</script>
</body></html>
