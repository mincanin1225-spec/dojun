<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFF8F1"><title>도준이 육아 v25</title><style>:root{--bg:#FFF8F1;--ink:#4A4038;--muted:#9B8F85;--line:#EEE2D6;--peach:#F2925C}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#EEE6DD;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}body{display:flex;justify-content:center}.shell{width:100%;max-width:520px;height:100dvh;background:var(--bg);display:flex;flex-direction:column}.head{padding:12px 14px 10px;border-bottom:1px solid var(--line);background:rgba(255,248,241,.97)}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:17px;font-weight:900}.desc{font-size:11px;color:var(--muted);margin-top:3px}.ver{font-size:11px;font-weight:800;color:white;background:var(--peach);padding:4px 8px;border-radius:99px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding:4px;background:#F2E8DE;border-radius:14px}.seg button{border:0;background:transparent;border-radius:11px;padding:9px;font-weight:800;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink)}.notice{font-size:11px;line-height:1.45;padding:7px 10px;margin-top:8px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--muted)}.framewrap{flex:1;min-height:0;position:relative;background:#fff}.frame{position:absolute;inset:0;width:100%;height:100%;border:0}.hidden{display:none}.foot{padding:6px 10px;font-size:10.5px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}</style></head><body><div class="shell"><header class="head"><div class="top"><div><div class="title">도준이 육아 · v25</div><div class="desc">전체 스케줄 + 이번 주 이유식 운영</div></div><span class="ver">v25</span></div><div class="seg"><button class="on" id="tab-app">전체 스케줄·기록</button><button id="tab-prep">식단 만들기·재고</button></div><div class="notice" id="notice"><b>전체 앱</b>과 새 이유식 운영 화면을 함께 볼 수 있어요.</div></header><div class="framewrap"><iframe class="frame" id="frame-app" src="./index.html?v=20260915c" title="전체 앱"></iframe><iframe class="frame hidden" id="frame-prep" src="./ppeuni-v25-live.html?v=20260915c" title="식단 만들기와 재고"></iframe></div><div class="foot">v25 실사용 준비판</div></div><script>(function(){const app=document.getElementById('frame-app'),prep=document.getElementById('frame-prep'),ta=document.getElementById('tab-app'),tp=document.getElementById('tab-prep'),n=document.getElementById('notice');function show(w){const a=w==='app';app.classList.toggle('hidden',!a);prep.classList.toggle('hidden',a);ta.classList.toggle('on',a);tp.classList.toggle('on',!a);n.innerHTML=a?'<b>전체 앱</b>입니다. 식단 만들기·재고에서 이번 주 운영 순서를 확인하세요.':'<b>이번 주 운영</b>입니다. 토요일 재고확인 → 일요일 1차 → 목요일 2차 순서로 진행합니다.';try{history.replaceState(null,'','#'+w)}catch(e){}}ta.onclick=()=>show('app');tp.onclick=()=>show('prep');if(location.hash==='#prep')show('prep');})();</script></body></html>
