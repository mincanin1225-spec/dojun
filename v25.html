<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F1">
<title>도준이 육아 v25 미리보기</title>
<style>
:root{--bg:#FFF8F1;--ink:#4A4038;--muted:#9B8F85;--line:#EEE2D6;--card:#fff;--peach:#F2925C;--mint:#6FBFA0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#EEE6DD;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;justify-content:center}.shell{width:100%;max-width:520px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 50px rgba(74,64,56,.08)}
.head{padding:12px 14px 10px;background:rgba(255,248,241,.97);border-bottom:1px solid var(--line);z-index:2}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:17px;font-weight:900}.ver{font-size:11px;font-weight:800;color:#fff;background:var(--peach);border-radius:99px;padding:4px 9px}.desc{font-size:11.5px;color:var(--muted);margin-top:3px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding:4px;background:#F2E8DE;border-radius:14px}.seg button{border:0;background:transparent;border-radius:11px;padding:9px 8px;font:inherit;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(74,64,56,.08)}
.notice{font-size:11px;line-height:1.45;padding:7px 10px;margin-top:8px;border-radius:10px;background:#fff;color:var(--muted);border:1px solid var(--line)}.notice b{color:var(--ink)}
.framewrap{flex:1;min-height:0;position:relative;background:#fff}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.hidden{display:none}
.foot{padding:6px 10px calc(6px + env(safe-area-inset-bottom));font-size:10.5px;text-align:center;color:var(--muted);background:#FFF8F1;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="top"><div><div class="title">도준이 육아 · v25 미리보기</div><div class="desc">전체 앱 구조 + 새 식단 만들기 흐름을 한 화면에서 확인</div></div><span class="ver">v25</span></div>
    <div class="seg" role="tablist" aria-label="v25 화면 선택">
      <button class="on" id="tab-app" role="tab" aria-selected="true">전체 스케줄·기록</button>
      <button id="tab-prep" role="tab" aria-selected="false">식단 만들기·재고</button>
    </div>
    <div class="notice" id="notice"><b>전체 앱</b>은 현재 v24 전체 기능을 그대로 보여줘요. 옆 탭에서 v25의 1·2차 준비·큐브 재고 흐름을 비교해 보세요.</div>
  </header>
  <div class="framewrap">
    <iframe class="frame" id="frame-app" src="./index.html" title="도준이 전체 앱"></iframe>
    <iframe class="frame hidden" id="frame-prep" src="./ppeuni-v25.html" title="도준이 식단 만들기와 재고"></iframe>
  </div>
  <div class="foot">판단용 통합 미리보기 · 기존 v24 데이터는 유지됩니다.</div>
</div>
<script>
(function(){
  const app=document.getElementById('frame-app'),prep=document.getElementById('frame-prep');
  const ta=document.getElementById('tab-app'),tp=document.getElementById('tab-prep'),notice=document.getElementById('notice');
  function show(which){
    const isApp=which==='app'; app.classList.toggle('hidden',!isApp);prep.classList.toggle('hidden',isApp);
    ta.classList.toggle('on',isApp);tp.classList.toggle('on',!isApp);ta.setAttribute('aria-selected',isApp);tp.setAttribute('aria-selected',!isApp);
    notice.innerHTML=isApp?'<b>전체 앱</b>은 현재 v24 전체 기능을 그대로 보여줘요. 옆 탭에서 v25의 1·2차 준비·큐브 재고 흐름을 비교해 보세요.':'<b>v25 작업 화면</b>입니다. 일요일→월~목 1차, 목요일→금~일 2차 준비와 식단 완료·큐브 재고를 시험합니다. 현재 식단은 개발용 임시 식단입니다.';
    try{history.replaceState(null,'','#'+which)}catch(e){}
  }
  ta.onclick=()=>show('app');tp.onclick=()=>show('prep');
  if(location.hash==='#prep')show('prep');
})();
</script>
</body>
</html>
